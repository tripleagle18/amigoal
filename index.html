function challengeItemLogBoxHtml(ch, item){
  const myLogs = challengeItemUserLogs(ch, item, currentUser.id);
  const today = todayKey();
  const emoji = itemEmoji(item);
  if(item.category === 'withhold'){
    const slippedToday = myLogs.some(l => l.date === today && l.slipped);
    return `
      <div class="log-today-box">
        <h4>${emoji} ${item.label}</h4>
        ${slippedToday
          ? `<div class="meta">You logged a slip today. Tomorrow's a fresh start.</div>`
          : `<div class="meta" style="margin-bottom:10px;">Clean so far today.</div>
             <button class="btn btn-ghost" onclick="logChallengeItemSlip(${jsAttr(ch.id)}, ${jsAttr(item.id)})">Log a slip today</button>`
        }
      </div>
    `;
  }
  if(item.category === 'custom'){
    const doneToday = myLogs.some(l => l.date === today);
    return `
      <div class="log-today-box">
        <h4>${emoji} ${item.label}</h4>
        ${doneToday ? `<div class="meta">✅ Logged for today.</div>` : `<button class="btn btn-primary btn-block" onclick="logChallengeItemCheckin(${jsAttr(ch.id)}, ${jsAttr(item.id)})">Log today's check-in</button>`}
      </div>
    `;
  }
  const todaySum = myLogs.filter(l=>l.date===today).reduce((s,l)=>s+(parseFloat(l.value)||0),0);
  return `
    <div class="log-today-box">
      <h4>${emoji} ${item.label}${todaySum>0 ? ` — logged ${todaySum}${item.unit?' '+item.unit:''} so far` : ''}</h4>
      <div class="log-today-row">
        <input type="number" id="challenge-log-input-${item.id}" placeholder="${item.label}${item.unit ? ' ('+item.unit+')' : ''}">
        <button class="btn btn-primary" onclick="logChallengeItemAmount(${jsAttr(ch.id)}, ${jsAttr(item.id)})">Log</button>
      </div>
    </div>
  `;
}
async function logChallengeItemAmount(challengeId, itemId){
  const input = document.getElementById('challenge-log-input-'+itemId);
  const val = parseFloat(input.value);
  if(!val || val <= 0){ showToast('Enter an amount first'); return; }
  const { error } = await sbClient.from('challenge_logs').insert({ challenge_id: challengeId, challenge_item_id: itemId, user_id: currentUser.id, log_date: todayKey(), value: val });
  if(error){ showToast("Couldn't log that — " + error.message); return; }
  await loadChallenges();
  showToast('Logged 🎉');
  render('challenge-detail');
}
async function logChallengeItemCheckin(challengeId, itemId){
  const { error } = await sbClient.from('challenge_logs').insert({ challenge_id: challengeId, challenge_item_id: itemId, user_id: currentUser.id, log_date: todayKey(), value: 1 });
  if(error){ showToast("Couldn't log that — " + error.message); return; }
  await loadChallenges();
  showToast('Logged 🎉');
  render('challenge-detail');
}
async function logChallengeItemSlip(challengeId, itemId){
  const { error } = await sbClient.from('challenge_logs').insert({ challenge_id: challengeId, challenge_item_id: itemId, user_id: currentUser.id, log_date: todayKey(), slipped: true });
  if(error){ showToast("Couldn't log that — " + error.message); return; }
  await loadChallenges();
  showToast('Logged — tomorrow is a fresh start');
  render('challenge-detail');
}
function moreInvitesPanelHtml(){
  return `
    <div class="ab-panel" style="border:1.5px solid var(--line); border-radius:12px; padding:14px;">
      <div class="invite-chip-list">
        ${moreInvitesDraft.map((inv,j)=>`<span class="ab-chip">${inv.firstName}${inv.lastName?' '+inv.lastName:''} <button onclick="removeMoreInvite(${j})">✕</button></span>`).join('')}
      </div>
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <input type="text" id="more-inv-fname" placeholder="First name" style="flex:1; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); font-size:14px;">
        <input type="text" id="more-inv-lname" placeholder="Last name (optional)" style="flex:1; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); font-size:14px;">
      </div>
      <div class="ab-invite-row">
        <select id="more-inv-type" onchange="updateMoreInviteFieldType()">
          <option value="email">Email</option>
          <option value="phone">Phone</option>
        </select>
        <input type="email" id="more-inv-value" placeholder="name@email.com">
        <button class="btn btn-ghost" style="padding:10px 14px; font-size:13px;" onclick="addMoreInvite()">Add</button>
      </div>
    </div>
  `;
}
function updateMoreInviteFieldType(){
  const type = document.getElementById('more-inv-type').value;
  const meta = abFieldMetaFor(type);
  const input = document.getElementById('more-inv-value');
  input.type = meta.inputType; input.placeholder = meta.placeholder; input.value = '';
}
function addMoreInvite(){
  const firstName = document.getElementById('more-inv-fname').value.trim();
  const lastName = document.getElementById('more-inv-lname').value.trim();
  const type = document.getElementById('more-inv-type').value;
  const val = document.getElementById('more-inv-value').value.trim();
  if(!firstName){ showToast('First name is required'); return; }
  if(!val) return;
  moreInvitesDraft.push({ firstName, lastName, type, value: val });
  render('challenge-manage');
}
function removeMoreInvite(j){ moreInvitesDraft.splice(j,1); render('challenge-manage'); }
async function sendMoreChallengeInvites(){
  if(moreInvitesDraft.length === 0){ showToast('Add at least one person first'); return; }
  const ch = myChallenges.find(c => c.id === currentChallengeId);
  if(!ch) return;
  for(const inv of moreInvitesDraft){
    const { error } = await sbClient.from('challenge_invites').insert({
      challenge_id: ch.id, inviter_user_id: currentUser.id,
      first_name: inv.firstName, last_name: inv.lastName || '',
      contact_type: inv.type === 'phone' ? 'phone' : 'email',
      contact_value: inv.value
    });
    if(error) showToast("Couldn't invite " + inv.firstName + " — " + error.message);
  }
  moreInvitesDraft = [];
  await loadChallenges();
  showToast('Invites sent');
  render('challenge-manage');
}
