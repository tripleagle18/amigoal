<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoRally — Goals are better together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1B2A54;
    --navy-deep: #10192F;
    --navy-soft: #3A4A78;
    --green: #6FBF3E;
    --green-light: #A9E06B;
    --green-deep: #4C9427;
    --paper: #F5F7F1;
    --card: #FFFFFF;
    --line: #E4E7DC;
    /* Macro/metric accent colors — each metric gets its own identity instead of everything reading as the same green. */
    --c-calories: #E8823C;
    --c-calories-soft: #FBEADB;
    --c-protein: #D24B4B;
    --c-protein-soft: #FAE3E3;
    --c-fat: #E3B23C;
    --c-fat-soft: #FBF1D8;
    --c-carbs: #B4863F;
    --c-carbs-soft: #F3E9D8;
    --c-water: #3E8FD6;
    --c-water-soft: #E1EEFA;
    /* Category accent colors — a quick-glance identity per goal type on the dashboard. */
    --cat-nutrition: #6FBF3E;
    --cat-steps: #3E8FD6;
    --cat-withhold: #1B2A54;
    --cat-custom: #8B5FBF;
    --ink: #16213D;
    --muted: #5B6478;
    --danger: #C1503A;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,25,47,0.06), 0 8px 24px rgba(16,25,47,0.06);
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3,.display{
    font-family: 'Poppins', 'Inter', sans-serif;
    color: var(--navy);
    margin: 0;
  }
  button{ font-family: inherit; }
  input, select{ font-family: inherit; }

  /* ---------- Shell ---------- */
  .shell{
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px calc(90px + env(safe-area-inset-bottom));
    padding-top: max(20px, env(safe-area-inset-top));
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
  }
  .brand-block{ cursor: pointer; display:flex; align-items:center; }
  .logo-img{
    height: 34px;
    width: auto;
    display:block;
  }
  .bell-btn{
    position: relative;
    width: 40px; height: 40px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .bell-btn .dot{
    position:absolute;
    top: 8px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1.5px solid #fff;
  }
  .notif-panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 6px;
    margin-bottom: 20px;
    max-height: 260px;
    overflow-y: auto;
  }
  .notif-item{
    padding: 12px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.45;
  }
  .notif-item + .notif-item{ border-top: 1px solid var(--line); }
  .notif-item .time{ display:block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .notif-empty{ padding: 18px 14px; font-size: 13px; color: var(--muted); text-align:center; }

  /* ---------- Ring icon (logo motif reused for progress / steps) ---------- */
  .ring{
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .ring svg circle{ fill:none; }
  @keyframes ring-pulse{ 0%{ transform:scale(1); } 35%{ transform:scale(1.14); } 65%{ transform:scale(0.96); } 100%{ transform:scale(1); } }
  .ring-complete{ animation: ring-pulse .5s ease; }

  /* ---------- Dashboard ---------- */
  .empty-state{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 28px;
    text-align: left;
    box-shadow: var(--shadow);
  }
  .empty-state h2{ font-size: 21px; margin-bottom: 8px; }
  .empty-state p{ color: var(--muted); line-height: 1.55; margin: 0 0 22px; max-width: 46ch; }

  .goal-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    gap: 18px;
    cursor: pointer;
    transition: box-shadow .15s ease, transform .1s ease;
  }
  .goal-card:active{ transform: scale(0.99); }
  .goal-card .info{ flex:1; min-width:0; }
  .goal-card h3{ font-size: 16px; margin-bottom: 3px; }
  .goal-card .meta{ font-size: 13px; color: var(--muted); }
  .streak-headline{
    display:flex;
    align-items:baseline;
    gap: 6px;
    margin: 2px 0 8px;
  }
  .streak-headline-num{
    font-family:'Poppins',sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height:1;
  }
  .streak-headline-word{
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .streak-share-btn{
    background:none; border:none; cursor:pointer; padding:0 0 0 2px;
    font-size:14px; line-height:1; opacity:0.75;
  }
  .streak-share-btn:hover{ opacity:1; }
  .goal-card .ab-tag{
    font-size: 12.5px;
    color: var(--muted);
    margin-left: 8px;
  }

  .btn{
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform .06s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--green); color: var(--navy-deep); }
  .btn-primary:hover{ background: var(--green-light); }
  .btn-ghost{ background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
  .btn-ghost:hover{ border-color: var(--navy-soft); }
  .btn-text{ background: none; color: var(--navy-soft); padding: 8px 4px; font-weight: 600; }
  .btn-text:hover{ color: var(--navy); }
  .btn[disabled]{ opacity: .45; cursor: not-allowed; }
  .btn-row{ display:flex; gap: 12px; margin-top: 30px; }
  .btn-block{ width: 100%; }

  /* ---------- Wizard shell ---------- */
  .wizard-head{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .back-btn{
    width: 34px; height: 34px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:hover{ border-color: var(--navy-soft); }
  .step-title{ font-size: 20px; }
  .step-sub{ font-size: 13.5px; color: var(--muted); margin-top: 2px; }

  .step-progress{
    display:flex;
    gap: 6px;
    margin: 4px 0 26px;
  }
  .step-progress .seg{
    height: 4px;
    flex:1;
    border-radius: 3px;
    background: var(--line);
  }
  .step-progress .seg.done{ background: var(--green); }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px;
    box-shadow: var(--shadow);
  }

  /* ---------- Category picker ---------- */
  .category-grid{ display:flex; flex-direction:column; gap: 12px; }
  .category-option{
    display:flex;
    align-items:center;
    gap: 16px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    text-align:left;
    transition: border-color .12s ease, background .12s ease;
  }
  .category-option:hover{ border-color: var(--green-deep); background: #FAFBF6; }
  .category-option .icon{
    width: 46px; height: 46px;
    border-radius: 12px;
    background: #EEF3E4;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .category-option h3{ font-size: 16.5px; }
  .category-option p{ margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }

  /* ---------- Forms ---------- */
  .field{ margin-bottom: 20px; }
  .field label{
    display:block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 7px;
  }
  .field .hint{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.4;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=email],
  .field input[type=tel],
  .field select{
    width: 100%;
    padding: 12px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    color: var(--ink);
    background: #FCFCFA;
  }
  .field input:focus, .field select:focus{
    outline: none;
    border-color: var(--green-deep);
    background: #fff;
  }
  .row-2{ display:flex; gap: 12px; }
  .row-2 .field{ flex:1; }

  .unit-toggle{
    display:inline-flex;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .unit-toggle button{
    border:none;
    background: var(--card);
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor:pointer;
  }
  .unit-toggle button.active{
    background: var(--navy);
    color: #fff;
  }

  .pill-group{ display:flex; flex-wrap:wrap; gap: 8px; }
  .pill{
    border: 1.5px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
  }
  .pill:hover{ border-color: var(--navy-soft); }
  .pill.active{ background: var(--navy); color:#fff; border-color: var(--navy); }

  .pill-desc{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
    min-height: 18px;
  }

  /* ---------- Result metric cards ---------- */
  .metric-card{
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    background: #FCFCFA;
  }
  .metric-card.disabled{ opacity: .5; }
  .metric-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
  }
  .metric-name{ font-weight: 700; font-size: 15px; color: var(--navy); }
  .metric-value-row{
    display:flex;
    align-items:baseline;
    gap: 6px;
    margin-top: 4px;
  }
  .metric-value-row input{
    width: 90px;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    background:#fff;
  }
  .metric-unit{ font-size: 13px; color: var(--muted); font-weight: 600; }

  /* toggle switch */
  .switch{
    position: relative;
    width: 42px; height: 24px;
    flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{
    position:absolute; inset:0;
    background: #D8DBCD;
    border-radius: 999px;
    transition: background .15s ease;
    cursor:pointer;
  }
  .switch .track:before{
    content:"";
    position:absolute;
    height: 18px; width: 18px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{ background: var(--green); }
  .switch input:checked + .track:before{ transform: translateX(18px); }

  .motivation-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .motivation-row .mtext{ font-size: 13px; color: var(--muted); flex:1; }
  .motivation-row .mtext strong{ color: var(--ink); font-weight: 600; }

  .ab-panel{
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .ab-invite-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ab-invite-row select{
    width: 92px;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 13px;
    background:#fff;
  }
  .ab-invite-row input{
    flex:1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 14px;
    background:#fff;
  }
  .ab-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: #EEF3E4;
    color: var(--navy);
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    margin: 4px 6px 0 0;
  }
  .ab-chip button{
    background:none; border:none; cursor:pointer;
    color: var(--navy-soft);
    font-size: 13px; line-height:1; padding:0;
  }
  .add-ab-link{
    font-size: 13px;
    color: var(--green-deep);
    font-weight: 600;
    background:none; border:none; cursor:pointer;
    padding: 4px 0;
  }

  .summary-note{
    background: #F2F6EA;
    border: 1px solid #D9E6C4;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--navy-soft);
    line-height: 1.55;
    margin-bottom: 22px;
  }

  .ab-list{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.6;
  }
  .ab-list .ab-label{ color: var(--muted); font-weight: 600; margin-right: 4px; }
  .ab-list .ab-confirmed{ color: var(--green-deep); }
  .ab-list .ab-confirmed:after{ content: " ✓"; }

  .progress-wrap{ margin-top: 14px; }
  .progress-track{
    height: 10px;
    border-radius: 999px;
    background: #E9ECE0;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(16,25,47,0.08);
  }
  .progress-fill{
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--green-deep), var(--green-light));
    transition: width .4s ease;
  }
  .progress-label{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 600;
  }
  .progress-label .pct{
    color: var(--navy);
    font-family:'Poppins',sans-serif;
    font-weight: 800;
    font-size: 17px;
  }
  .time-remaining-wrap{ margin-top: 8px; }
  .time-remaining-track{
    height: 6px;
    border-radius: 999px;
    background: #E9ECE0;
    overflow: hidden;
  }
  .time-remaining-fill{
    height: 100%;
    border-radius: 999px;
    transition: width .4s ease;
  }
  .time-remaining-label{
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 600;
  }

  .status-badge{
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink:0;
    white-space: nowrap;
  }
  .status-accepted{ background:#EAF4DE; color:var(--green-deep); }

  .digest-banner{
    background: #FFF7E6;
    border: 1px solid #F1DFA6;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 18px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .digest-banner p{ margin:0; font-size: 13.5px; color: #8A6A1F; line-height:1.5; }

  .digest-email{
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    background: var(--card);
  }
  .digest-email .to{ font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .digest-email .subject{ font-weight: 700; color: var(--navy); font-size: 15px; margin-bottom: 12px; }
  .digest-goal-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
  }
  .digest-goal-row:first-of-type{ border-top: 1px solid var(--line); }
  .digest-goal-row .g{ font-size: 13.5px; color: var(--ink); }
  .digest-goal-row .g strong{ display:block; color: var(--navy); font-size: 14px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    display:flex;
    justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .nav-item{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 3px;
    background:none;
    border:none;
    cursor:pointer;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 8px;
    min-height: 44px;
  }
  .nav-item.active{ color: var(--green-deep); }
  .nav-item svg{ display:block; }

  /* ---------- Profile page ---------- */
  .profile-section{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .profile-section h2{ font-size: 15.5px; margin-bottom: 14px; }
  .stat-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 9px 0;
    font-size: 14px;
    border-top: 1px solid var(--line);
  }
  .stat-row:first-of-type{ border-top:none; }
  .stat-row .label{ color: var(--muted); }
  .stat-row .val{ font-weight: 600; color: var(--navy); }

  .goal-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .goal-row:first-of-type{ border-top:none; }
  .goal-row .label{ font-size: 14px; color: var(--muted); }
  .goal-row .val-group{ display:flex; align-items:center; gap: 10px; }
  .goal-row .val{ font-weight: 700; font-size: 15px; color: var(--navy); min-width: 62px; text-align:right; }
  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    padding: 5px;
    line-height: 1;
  }
  .reset-link{
    font-size: 12px;
    font-weight: 600;
    color: var(--green-deep);
    background: none;
    border: none;
    cursor: pointer;
  }

  .ab-goal-block{ margin-bottom: 14px; }
  .ab-goal-block:last-child{ margin-bottom: 0; }
  .ab-goal-title{ font-weight: 700; font-size: 14px; color: var(--navy); margin-bottom: 6px; }
  .ab-person-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 6px 0 6px 12px;
    color: var(--ink);
    border-left: 2px solid var(--line);
  }
  .ab-checkin-status{
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 8px 12px;
  }
  .ab-checkin-status.ab-checkin-pending{ color:#8A7A2E; font-weight:600; }
  .ab-checkin-note{
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .empty-inline{
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* GOAL STATS MODAL — the "tap a goal card" deep-dive: creation date,
     current/longest streaks, and per-metric AB status, opened via the
     shared openModal() system rather than a new view. */
  .stat-modal-scroll{ max-height: 72vh; overflow-y: auto; margin: -2px -4px 14px; padding: 2px 4px; }
  .stat-hero{ text-align:center; margin-bottom: 16px; }
  .stat-hero-emoji{ font-size: 34px; line-height:1; margin-bottom: 4px; }
  .stat-hero-since{ font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stat-section-title{
    font-family:'Poppins',sans-serif; font-weight:700; font-size: 13px;
    color: var(--navy); text-transform: uppercase; letter-spacing: .04em;
    margin: 18px 0 8px;
  }
  .stat-section-title:first-of-type{ margin-top: 0; }
  .stat-streak-grid{ display:flex; gap: 10px; }
  .stat-box{
    flex:1; border-radius: 14px; padding: 14px 10px; text-align:center;
  }

  /* CHALLENGES */
  .challenge-card-emoji{ font-size: 32px; line-height:1; }

  .leaderboard-name{ flex:1; font-size: 14.5px; font-weight:700; color: var(--ink); min-width:0; }

  /* Leaderboard v2 — its own card, avatar initials, a bar scaled against

  .leaderboard-card{
    background: var(--card); border-radius: 16px; padding: 14px 16px 6px;

    font-family:'Poppins',sans-serif; font-weight:800; font-size: 15px; color: var(--navy); margin-bottom: 8px;
  }
  .lb-row{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row.is-me{ background: var(--paper); border-radius: 10px; padding-left: 8px; padding-right: 8px; }
  .lb-rank{ width: 22px; text-align:center; font-family:'Poppins',sans-serif; font-weight:800; font-size: 14px; color: var(--muted); flex-shrink:0; }

  .lb-avatar{

  .lb-main{ flex:1; min-width:0; }
  .lb-name{ font-size: 13.5px; font-weight:700; color: var(--ink); margin-bottom: 4px; }
  .lb-name .you-tag{ font-size:11px; font-weight:600; color: var(--green-deep); margin-left:4px; }
  .lb-bar-track{ height: 6px; border-radius: 4px; background: var(--paper); overflow:hidden; }

  .lb-points-wrap{ flex-shrink:0; text-align:right; }
  .lb-points{ font-family:'Poppins',sans-serif; font-weight:800; font-size: 16px; color: var(--navy); }
  .lb-points-label{ font-size: 10px; font-weight:600; color: var(--muted); }

  /* A visible break between "look at standings" and "log your own stuff" */
  .section-divider{
    height: 1px; background: linear-gradient(to right, transparent, var(--line) 15%, var(--line) 85%, transparent);
    margin: 22px 0 18px;
  }
  .log-section-card{
    background: var(--paper); border-radius: 16px; padding: 14px 16px; margin-bottom: 18px;
  }
  .log-section-title{

  .challenge-meta-row{
    display:flex; justify-content:space-between; align-items:center;

  .points-key{

  }

  .log-today-row{ display:flex; gap: 8px; }

  .invite-chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 10px; }
  .points-edit-card{

  }
  .points-edit-title{ font-size: 13.5px; font-weight:700; color: var(--ink); margin-bottom: 8px; }
  .points-edit-row{ display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: 6px; }
  .points-edit-row:last-child{ margin-bottom: 0; }
  .points-edit-row label{ font-size: 12.5px; color: var(--muted); font-weight:600; }
  .points-edit-row input{
    width: 70px; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); font-size: 13.5px; text-align:center;
  }

  .weight-history-empty{
    text-align:center;
    padding: 22px 10px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .logout-btn{
    width: 100%;
    text-align:center;
    background: #FDF2EF;
    color: var(--danger);
    border: 1.5px solid #F1C7B9;
    border-radius: 12px;
    padding: 14px;
    font-weight: 700;
    font-size: 15px;

  }
  /* ---------- Log page ---------- */
  .day-nav{
    display:flex;
    align-items:center;
    justify-content: space-between;

    border: 1px solid var(--line);

  .day-nav-arrow{

  .withhold-streak-display{

  .log-goal-card{

  }

  .mini-metric-row{ margin-bottom: 12px; }

  .mini-metric-top{
    display:flex;
    justify-content: space-between;
    font-size: 12.5px;
    margin-bottom: 5px;
  }
  .mini-metric-top .name{ color: var(--ink); font-weight: 600; }
  .mini-metric-top .amt{ color: var(--muted); }
  .mini-track{
    height: 7px;
    border-radius: 999px;
    background: #E9ECE0;
    overflow: hidden;
  }
  .mini-fill{ height:100%; border-radius:999px; background: var(--green); transition: width .3s ease; }
  .mini-metric-streak{ font-size:12px; font-weight:700; margin-top:5px; }

  .log-tool{
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 15px 16px;
    margin-top: 14px;
  }
  .log-tool-head{ display:flex; align-items:center; gap:8px; margin-bottom: 4px; }
  .log-tool-head .name{ font-weight: 700; font-size: 14px; color: var(--navy); }
  .log-tool-head .badge{
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: #EEF3E4;
    color: var(--green-deep);
  }
  .log-tool-desc{ font-size: 12.5px; color: var(--muted); margin-bottom: 11px; }
  .log-tool.locked{ opacity: .6; background: #FAFAF7; cursor:not-allowed; }
  .log-tool.locked .log-tool-head .badge{ background:#EFE6D8; color:#8A6A2E; }

  .quick-add-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 10px; }
  .quick-add-btn{
    border: 1.5px solid var(--line);
    background: #FCFCFA;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    cursor:pointer;
  }
  .quick-add-btn:hover{ border-color: var(--green-deep); }
  .custom-amount-row{ display:flex; gap:8px; }
  .custom-amount-row input{
    flex:1;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 14px;
  }

  .manual-entry-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-top:10px; }
  .manual-entry-grid .me-field{ flex:1; }
  .manual-entry-grid label{ font-size: 11px; color: var(--muted); font-weight:700; display:block; margin-bottom:4px; }
  .manual-entry-grid input{
    width:100%;
    padding: 9px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 14px;
    text-align:center;
  }
  .manual-entry-total{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .manual-entry-total-label{
    font-size: 12px; font-weight:700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px; margin-bottom: 8px;
  }
  .manual-entry-total-grid{
    display:flex; flex-wrap:wrap; gap: 10px 16px;
    font-size: 13.5px; color: var(--ink);
  }
  .manual-entry-total-grid b{ color: var(--navy); }

  .steps-input-row, .custom-log-row{ display:flex; gap:8px; align-items:center; }
  .steps-input-row input{
    flex:1;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: 16px;
  }
  .custom-progress-text{ font-size: 13.5px; color: var(--muted); margin-bottom: 12px; }
  .custom-done-btn{
    width:100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: var(--navy-deep);
    font-weight: 700;
    font-size: 15px;
    cursor:pointer;
  }
  .custom-done-btn.done{
    background: #EAF4DE;
    color: var(--green-deep);
    cursor: default;
  }

  /* ---------- Modal (replaces window.prompt/confirm, which are blocked in the published sandbox) ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(16,25,47,.5);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    padding: 20px;
  }
  .modal-card{
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size: 17px; color: var(--navy); margin-bottom: 6px; }
  .modal-desc{ font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height:1.5; }
  .modal-card input, .modal-card select{
    width:100%;
    padding: 12px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: 16px;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ flex:1; }
  .modal-pill-group{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }

  .toast{
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy-deep);
    color: #fff;
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    gap: 8px;
    opacity: 0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ---------- First-launch onboarding carousel ---------- */
  .onboarding-overlay{
    position: fixed; inset: 0;
    background: var(--paper);
    z-index: 200;
    display:flex; flex-direction:column;
    padding: 22px 22px calc(24px + env(safe-area-inset-bottom,0px));
  }
  .onboarding-skip{
    align-self:flex-end;
    background:none; border:none; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; padding:6px;
  }
  .onboarding-body{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; max-width: 420px; margin: 0 auto; width:100%;
  }
  .onboarding-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:23px; color:var(--navy); }
  .onboarding-text{ font-size:14.5px; color:var(--muted); line-height:1.6; max-width:36ch; }
  .onboarding-cats{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:4px; }
  .onboarding-cat-chip{
    display:flex; align-items:center; gap:6px; background:var(--card); border:1.5px solid var(--line);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--navy);
  }
  .onboarding-dots{ display:flex; gap:7px; justify-content:center; margin: 18px 0; }
  .onboarding-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .onboarding-dot.active{ background: var(--green); width:20px; border-radius:5px; transition: all .2s ease; }
  .onboarding-actions{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px; margin: 0 auto; }

  /* ---------- Splash video (real brand MP4, first launch only) ---------- */
  .splash-overlay{
    position: fixed; inset: 0;
    background: #FFFFFF;
    z-index: 300;
    display:flex; align-items:center; justify-content:center;
  }
  .splash-video{ width:100%; height:100%; object-fit:contain; }
  .splash-skip{
    position:absolute; top: calc(16px + env(safe-area-inset-top,0px)); right:16px;
    background: rgba(17,34,77,.08); border:none; color:var(--navy); font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:999px; cursor:pointer;
  }

  /* ---------- Auth — gates the app behind a real Supabase account ---------- */
  .auth-overlay{
    position: fixed; inset: 0;
    background: var(--paper);
    z-index: 290;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    overflow-y: auto;
  }
  .auth-card{ width:100%; max-width:360px; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .auth-tab{
    flex:1; text-align:center; padding:10px; border-radius:10px; border:none;
    background:var(--line); color:var(--muted); font-weight:700; font-size:14px; cursor:pointer;
  }
  .auth-tab.active{ background:var(--navy); color:#fff; }
  .auth-error{
    background:#FBE9E7; color:#A23B2E; font-size:13px; font-weight:600;
    padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none;
  }
  .auth-notice{
    background:#EEF3E4; color:#3E5A1F; font-size:13px; font-weight:600;
    padding:12px; border-radius:10px; margin-bottom:14px; text-align:center; line-height:1.4;
  }

  /* ---------- Streak celebration (real video for day 1, live component after) ---------- */
  .celebration-overlay{
    position: fixed; inset: 0;
    background: rgba(16,25,47,.72);
    z-index: 250;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .celebration-card{
    background: var(--card);
    border-radius: 20px;
    padding: 26px 22px;
    width:100%; max-width: 360px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
    text-align:center;
  }
  .celebration-video-wrap{ border-radius:14px; overflow:hidden; line-height:0; position:relative; }
  .celebration-sound-btn{
    position:absolute; bottom:10px; right:10px;
    width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(16,25,47,.55); color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .celebration-close-btn{
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(16,25,47,.55); color:#fff; font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  /* Video celebrations go edge-to-edge instead of sitting in the small
     modal-style card — a phone-filling video read as "it's not full
     screen" when boxed into a 360px card with visible backdrop around it.
     Padding here is a fixed estimate for the iPhone status-bar/home-
     indicator area rather than env(safe-area-inset-*), since turning on
     viewport-fit=cover to make that work for real is a page-wide change
     that could shift every other fixed-position element in the app (the
     bottom nav included) — too risky to do for one screen without a
     device to verify the rest of the app against afterward. */
  .celebration-overlay.video-mode{ padding:0; background:#000; }
  .celebration-card.video-mode{
    width:100%; height:100%; max-width:none; max-height:none;
    padding:0; border-radius:0; box-shadow:none; background:#000;
  }
  .celebration-video-wrap.fullscreen{ width:100%; height:100%; border-radius:0; }
  .celebration-video-wrap.fullscreen video{ height:100%; object-fit:cover; }
  .celebration-video-wrap.fullscreen .celebration-close-btn{ top:44px; }
  .celebration-video-wrap.fullscreen .celebration-banner-top{ padding-top:44px; }
  .celebration-video-wrap.fullscreen .celebration-banner-bottom{ bottom:92px; }
  .celebration-floating-share{
    position:absolute; left:16px; right:16px; bottom:34px; z-index:2;
  }
  .celebration-floating-share .btn{ background:rgba(16,25,47,.55); color:#fff; border-color:rgba(255,255,255,.3); }
  .celebration-video-wrap video{ width:100%; display:block; }
  .celebration-banner-top{
    position:absolute; top:0; left:0; right:0;
    background: linear-gradient(to bottom, rgba(16,25,47,.78), transparent);
    color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:15px;
    text-align:center; padding: 14px 16px 26px;
  }
  .celebration-banner-bottom{
    position:absolute; left:10px; bottom:10px;
    background: rgba(16,25,47,.68); color:#fff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px;
    padding: 6px 13px; border-radius:999px;
  }
  .streak-celebrate{
    position:relative; height:180px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .streak-ripple{
    position:absolute; border-radius:50%;
    border: 2.5px solid var(--green);
    opacity:0;
    animation: streak-ripple-anim 1.8s ease-out infinite;
  }
  .streak-ripple.r1{ width:90px; height:90px; animation-delay:0s; }
  .streak-ripple.r2{ width:90px; height:90px; animation-delay:.4s; }
  .streak-ripple.r3{ width:90px; height:90px; animation-delay:.8s; }
  @keyframes streak-ripple-anim{
    0%{ transform:scale(.6); opacity:.55; }
    100%{ transform:scale(2.6); opacity:0; }
  }
  .streak-badge{
    position:relative; z-index:2;
    width:112px; height:112px; border-radius:50%;
    background: var(--paper);
    box-shadow: 0 0 0 5px #EAF4DE, 0 8px 24px rgba(111,191,62,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
  }
  .streak-badge-label{ font-family:'Poppins',sans-serif; font-weight:700; font-size:11px; letter-spacing:1.5px; color:var(--green-deep); }
  .streak-badge-num{ font-family:'Poppins',sans-serif; font-weight:800; font-size:34px; color:var(--navy); line-height:1; }
  .streak-confetti{ position:absolute; inset:0; pointer-events:none; }
  .confetti-piece{
    position:absolute; top:-10px; width:7px; height:12px; border-radius:2px;
    animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
  }
  @keyframes confetti-fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(190px) rotate(340deg); opacity:0; }
  }

  /* ---------- Shareable streak card — fixed brand colors (not theme
     tokens), since this is an exported image people post elsewhere, not
     in-app chrome. Matches the approved mockup exactly. ---------- */
  .share-card{
    position:relative; width:300px; height:530px; background:#F7F8F2;
    border-radius:22px; border:1px solid #E4E1D3; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    font-family:'Poppins','Montserrat',Arial,sans-serif;
  }
  .share-card .my-streak{ margin-top:34px; font-weight:700; font-size:13px; letter-spacing:3px; color:#5F6B52; }
  .share-card .big-num{ margin-top:44px; font-weight:800; font-size:118px; line-height:1; color:#11224D; }
  .share-card .unit{ margin-top:10px; font-weight:800; font-size:27px; letter-spacing:1px; color:#5B9A1E; }
  .share-card .goal-name-line{ margin-top:10px; font-weight:600; font-size:15px; color:#5F6B52; }
  .share-card .logo-wrap{ flex:1; display:flex; align-items:flex-end; padding-bottom:26px; }
  .share-card .logo-wrap img{ width:190px; display:block; }

  /* ---------- Share sheet — where you choose "include goal name" before
     the card is rendered and handed to the OS share sheet / download. ---------- */
  .share-sheet-overlay{
    position: fixed; inset: 0;
    background: rgba(16,25,47,.72);
    z-index: 260;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .share-sheet-card{
    background: var(--card);
    border-radius: 20px;
    padding: 22px 20px;
    width:100%; max-width: 340px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
    text-align:center;
  }
  .share-sheet-preview{ display:flex; justify-content:center; margin-bottom:16px; }
  .share-sheet-preview .share-card{ transform: scale(0.55); transform-origin: top center; margin-bottom: -235px; }
  .share-sheet-toggle{
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-size:14px; color:var(--navy); margin-bottom:16px; cursor:pointer;
  }
  .share-sheet-toggle input{ width:16px; height:16px; accent-color:var(--green); }

  /* ---------- Guided first-goal walkthrough — a pulsing glow applied directly
     to the real control being explained, so it reads as "click here" rather
     than just a nearby text bubble. ---------- */
  .tour-highlight{
    border-radius: 12px;
    animation: tour-pulse 1.6s ease-in-out infinite;
  }
  .switch.tour-highlight{ border-radius: 999px; }
  @keyframes tour-pulse{
    0%, 100% { box-shadow: 0 0 0 3px var(--green), 0 0 14px 2px rgba(111,191,62,.5); }
    50%      { box-shadow: 0 0 0 3px var(--green-light), 0 0 20px 7px rgba(111,191,62,.8); }
  }

  /* ---------- Inline guided tips — dismissible, shown once per concept via localStorage ---------- */
  .tip-card{
    display:flex; align-items:center; gap:12px; justify-content:space-between;
    background:#EAF4DE; border:1.5px solid var(--green-light); border-radius:10px;
    padding:12px 14px; margin-bottom:14px; font-size:13px; color:var(--navy); line-height:1.5;
  }
  .tip-card .tip-text{ flex:1; }
  .tip-card .tip-dismiss{
    background:none; border:none; color:var(--green-deep); font-weight:700; font-size:12.5px;
    cursor:pointer; white-space:nowrap; padding:4px 2px; flex-shrink:0;
  }

  .freq-note{
    font-size: 12.5px;
    color: var(--green-deep);
    background: #EEF3E4;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    line-height: 1.5;
  }

  /* ---------- Mobile-first tuning ---------- */
  /* Inputs at 16px+ prevent iOS Safari's auto-zoom on focus */
  .field input[type=text], .field input[type=number], .field input[type=email],
  .field input[type=tel], .field select, .ab-invite-row input, .ab-invite-row select{
    font-size: 16px;
  }
  /* Touch targets */
  .btn, .pill, .category-option, .back-btn, .bell-btn, .unit-toggle button{ min-height: 44px; }
  .switch{ width: 46px; height: 27px; }
  .switch .track:before{ height: 21px; width: 21px; }
  .switch input:checked + .track:before{ transform: translateX(19px); }

  @media (max-width: 480px){
    .shell{ padding: 16px 14px calc(90px + env(safe-area-inset-bottom)); }
    .logo-img{ height: 28px; }
    .row-2{ flex-direction: column; gap: 0; }
    .row-2 .field{ margin-bottom: 0; }
    .row-2 .field:not(:last-child){ margin-bottom: 20px; }
    .card{ padding: 18px 16px; }
    .category-option{ padding: 15px 14px; gap: 12px; }
    .category-option .icon{ width: 40px; height: 40px; }
    .category-option h3{ font-size: 15.5px; }
    .category-option p{ font-size: 13px; }
    .step-title{ font-size: 18px; }
    .pill-group{ gap: 6px; }
    .pill{ padding: 9px 13px; font-size: 13px; flex: 1 1 auto; text-align:center; }
    .unit-toggle{ display:flex; width:100%; }
    .unit-toggle button{ flex:1; padding: 10px 8px; }
    .ab-invite-row{ flex-wrap: wrap; }
    .ab-invite-row select{ width: 100%; }
    .ab-invite-row input{ width: 100%; flex: 1 1 100%; }
    .ab-invite-row .btn{ width: 100%; }
    .metric-value-row input{ width: 76px; }
    .goal-card{ flex-direction: column; align-items:flex-start; gap: 10px; }
    .btn-row{ flex-direction: column; }
    .btn-row .btn{ width: 100%; }
    .wizard-head{ align-items:flex-start; }
  }

  @media (max-width: 360px){
    .pill-group .pill{ flex: 1 1 100%; }
  }
</style>

<script>
/* =========================================================================
   AMIGOAL — PROTOTYPE
   This is a working, click-through prototype of the goal-creation flow.
   Data is stored in the browser only (not yet wired to a real Supabase
   backend) so you can try it end to end. Nothing here sends invites,
   pushes notifications, or persists across devices — that's the real
   backend work still to come.
   ========================================================================= */

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let goals = []; // populated by loadGoalsFromSupabase() once signed in
let draft = null; // in-progress goal being created
let notifications = loadNotifications();
let currentUserName = localStorage.getItem('amigoal_user_name_demo') || '';

// ---------------------------------------------------------------------
// GOAL SYNC — goals/goal_metrics/nutrition_profiles are real Supabase
// tables now. Logging (food/water/steps/custom/slip), each metric's AB
// list, and streak-celebration tracking are NOT part of this phase — they
// still live in localStorage, merged back onto each goal after it loads,
// keyed by the goal's real database id so it survives a reload. That's
// the next phase on the roadmap, not an oversight.
//
// Client-side field names sometimes differ from the schema's (chosen
// before either existed, in the other's own context) — these mappings
// translate at the boundary so nothing else in the app has to change.
// ---------------------------------------------------------------------
function clientCategoryToDb(cat){ return cat === 'nutrition' ? 'nutrition_weight' : cat; }
function dbCategoryToClient(cat){ return cat === 'nutrition_weight' ? 'nutrition' : cat; }
function clientPeriodToDb(p){ return { day:'daily', week:'weekly', month:'monthly', custom:'custom' }[p] || 'daily'; }
function dbPeriodToClient(p){ return { daily:'day', weekly:'week', monthly:'month', custom:'custom' }[p] || 'day'; }
function clientMetricKeyToDb(key){ return key === 'custom' ? 'custom_activity' : key; }
function dbMetricKeyToClient(key){ return key === 'custom_activity' ? 'custom' : key; }
function clientPregnancyToDb(p){ return { none:'not_pregnant_or_breastfeeding', pregnant:'pregnant', bf_early:'breastfeeding_0_6mo', bf_late:'breastfeeding_7_12mo' }[p] || 'not_pregnant_or_breastfeeding'; }
function dbPregnancyToClient(p){ return { not_pregnant_or_breastfeeding:'none', pregnant:'pregnant', breastfeeding_0_6mo:'bf_early', breastfeeding_7_12mo:'bf_late' }[p] || 'none'; }
function periodNounFor(p){ return { day:'day', week:'week', month:'month', custom:'custom period' }[p] || 'period'; }

// Fixed display labels for the metric types that don't need their own
// stored label — custom/withhold instead just reuse the goal's own title.
const METRIC_FIXED_LABEL = { calories:'Calories', protein:'Protein', fat:'Fat', carbs:'Carbs', water:'Water', steps:'Steps' };

function extensionStorageKey(){ return 'amigoal_goal_ext_' + (currentUser ? currentUser.id : 'anon'); }
function loadExtensions(){
  try{ return JSON.parse(localStorage.getItem(extensionStorageKey()) || '{}'); }catch(e){ return {}; }
}
// Every existing call site that logs food/water/steps/custom, adds/removes
// an AB, or updates streak-celebration tracking already calls this — it's
// the one function that changed meaning, not dozens of call sites.
function saveGoals(){
  try{
    const ext = {};
    goals.forEach(g => {
      ext[g.id] = {
        streakCelebrations: g.streakCelebrations || {},
        metricAbs: Object.fromEntries((g.metrics || []).map(m => [m.key, m.abs || []]))
      };
    });
    localStorage.setItem(extensionStorageKey(), JSON.stringify(ext));
  }catch(e){}
}

function dbMetricToClient(mr, goalRow, metricAbsMap){
  const key = dbMetricKeyToClient(mr.metric_type);
  const abs = (metricAbsMap && metricAbsMap[key]) || [];
  const m = {
    id: mr.id, // real goal_metrics.id — logging writes against this
    key,
    label: METRIC_FIXED_LABEL[key] || goalRow.label,
    unit: mr.unit || '',
    value: mr.metric_type === 'custom_activity' ? mr.target_count_per_period
         : mr.metric_type === 'withhold' ? 1
         : mr.target_value,
    originalValue: mr.target_value,
    enabled: mr.enabled,
    motivation: mr.motivation_mode_enabled,
    abs
  };
  if(mr.metric_type === 'steps'){
    m.perPeriod = true;
    m.periodLabel = dbPeriodToClient(goalRow.period_type);
    m.customDays = goalRow.custom_period_days;
    m.stepsMode = mr.steps_mode || 'daily';
  } else if(mr.metric_type === 'custom_activity'){
    m.periodLabel = dbPeriodToClient(goalRow.period_type);
    m.customDays = goalRow.custom_period_days;
    m.unit = 'x / ' + periodNounFor(m.periodLabel);
  } else if(mr.metric_type === 'withhold'){
    m.periodLabel = dbPeriodToClient(goalRow.period_type);
    m.unit = 'day streak';
  }
  return m;
}

function dbGoalToClient(row, ext){
  ext = ext || {};
  const category = dbCategoryToClient(row.category);

  // Each goal_metric row carries its own nested goal_metric_logs — split
  // those into the right client-side array by metric type as we map the
  // metrics themselves, so one pass builds both.
  let waterLog = [], stepsLog = [], customLog = [], slipLog = [];
  const metrics = (row.goal_metrics || []).map(mr => {
    const m = dbMetricToClient(mr, row, ext.metricAbs);
    const logs = (mr.goal_metric_logs || []).slice().sort((a,b) => a.log_date < b.log_date ? -1 : 1);
    if(mr.metric_type === 'water'){
      waterLog = logs.map(l => ({ id: l.id, date: l.log_date, amount: l.value, loggedAt: new Date(l.logged_at).getTime() }));
    } else if(mr.metric_type === 'steps'){
      stepsLog = logs.map(l => ({ id: l.id, date: l.log_date, value: l.value, loggedAt: new Date(l.logged_at).getTime() }));
    } else if(mr.metric_type === 'custom_activity'){
      customLog = logs.map(l => ({ id: l.id, date: l.log_date, loggedAt: new Date(l.logged_at).getTime() }));
    } else if(mr.metric_type === 'withhold'){
      slipLog = logs.map(l => ({ id: l.id, date: l.log_date, loggedAt: new Date(l.logged_at).getTime() }));
    }
    return m;
  });

  const foodLog = (row.food_log_entries || []).map(fe => ({
    id: fe.id, date: fe.log_date, name: fe.name,
    protein: fe.protein_g, fat: fe.fat_g, carbs: fe.carbs_g, calories: fe.calories,
    source: fe.source, loggedAt: new Date(fe.logged_at).getTime()
  }));

  const g = {
    id: row.id,
    title: row.label,
    category,
    metrics,
    createdAt: new Date(row.created_at).getTime(),
    foodLog, waterLog, stepsLog, customLog, slipLog,
    streakCelebrations: ext.streakCelebrations || {},
    targetWeight: null, nutritionInputs: null,
    hidden: !!row.hidden
  };
  // nutrition_profiles is a true 1:1 (goal_id is unique) — Supabase can
  // embed a to-one relation as either a single object or a one-item array
  // depending on how it infers the relationship, so handle both rather
  // than assuming an array and silently getting undefined otherwise.
  const npRaw = row.nutrition_profiles;
  const np = Array.isArray(npRaw) ? npRaw[0] : npRaw;
  if(category === 'nutrition' && np){
    const heightCm = np.height_cm || 0;
    const weightKg = np.weight_kg || 0;
    const totalIn = heightCm / 2.54;
    g.nutritionInputs = {
      sex: np.sex, age: np.age_years, activity: np.activity_level,
      pregnancy: dbPregnancyToClient(np.pregnancy_status),
      direction: np.goal_direction,
      // Height/weight are only ever stored in metric — this defaults the
      // edit screen to metric (the real values) rather than US, and also
      // back-converts to feet/inches/pounds so switching the unit toggle
      // mid-edit still shows correct numbers instead of blanks.
      units: 'metric',
      heightCm, weightKg,
      heightFt: Math.floor(totalIn / 12) || null,
      heightIn: Math.round(totalIn % 12) || null,
      weightLb: weightKg ? Math.round(weightKg * 2.20462 * 10) / 10 : null
    };
    g.targetWeight = np.target_weight_kg;
  }
  return g;
}

async function loadGoalsFromSupabase(){
  const { data, error } = await sbClient

// ---------------------------------------------------------------------
// MODAL — replaces window.prompt()/confirm(), which the published
// artifact's sandboxed iframe blocks silently (they just no-op). Every
// "tap to edit" and confirmation in the app routes through this instead.
// ---------------------------------------------------------------------
function closeModal(){
  document.getElementById('modal-overlay').style.display = 'none';
  document.getElementById('modal-card').innerHTML = '';
  // The page behind the modal was rendered before whatever just happened
  // inside it (logging progress, removing someone, editing a target...) —
  // without this, closing a modal left stale data on screen, e.g. the
  // dashboard still showing "nothing logged today" right after actually
  // logging something, since Home was never told anything changed. This
  // makes closeModal always hand back an up-to-date view, regardless of
  // which modal was open or what it did inside it.
  render(currentView);
}
function openModal(html){
  document.getElementById('modal-card').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
  const firstInput = document.querySelector('#modal-card input');
  if(firstInput) setTimeout(()=>{ firstInput.focus(); firstInput.select(); }, 30);
}
// Text/number input modal. onConfirm receives the raw string value.
function promptModal(title, opts){
  opts = opts || {};
  openModal(`
    <div class="modal-title">${title}</div>
    ${opts.desc ? `<div class="modal-desc">${opts.desc}</div>` : ''}
    <input type="${opts.type||'text'}" id="modal-input-field" value="${opts.value !== undefined && opts.value !== null ? opts.value : ''}" placeholder="${opts.placeholder||''}"
      onkeydown="if(event.key==='Enter') submitPromptModal()">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPromptModal()">Save</button>
    </div>
  `);
  window._modalOnConfirm = opts.onConfirm;
}
function submitPromptModal(){
  const val = document.getElementById('modal-input-field').value;
  const cb = window._modalOnConfirm;
  closeModal();
  if(cb) cb(val);
}
// Pick-one modal — buttons instead of typing, for categorical fields (sex, activity, etc).
function chooseModal(title, options, onConfirm, desc){
  openModal(`
    <div class="modal-title">${title}</div>
    ${desc ? `<div class="modal-desc">${desc}</div>` : ''}
    <div class="modal-pill-group">
      ${options.map(o => `<button class="pill" onclick="window._modalChoice('${o.value}')">${o.label}</button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button></div>
  `);
  window._modalOnConfirm = onConfirm;
  window._modalChoice = function(v){ closeModal(); onConfirm(v); };
}
// Yes/no confirmation modal — replaces window.confirm().
function confirmModal(title, desc, onConfirm){
  openModal(`
    <div class="modal-title">${title}</div>
    ${desc ? `<div class="modal-desc">${desc}</div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="window._modalConfirmYes()">Confirm</button>
    </div>
  `);
  window._modalConfirmYes = function(){ closeModal(); onConfirm(); };
}

// mirrors it call for call, including stripping the token from the URL
// either way so a refresh/share doesn't re-trigger acceptance.
async function processPendingChallengeInvite(){
  if(!pendingAcceptChallengeToken) return;
  const token = pendingAcceptChallengeToken;
  pendingAcceptChallengeToken = null;
  window.history.replaceState({}, '', window.location.pathname);
  try{
    const { data, error } = await sbClient.functions.invoke('accept-challenge-invite', { body: { invite_token: token } });
    if(error || (data && data.error)){
      showToast("Couldn't join that challenge — " + (data?.error || error.message));
      return;
    }
    await loadChallenges();
    openModal(`
      <div class="modal-title">You're in! 🏆</div>
      <div class="modal-desc" style="text-align:left; line-height:1.5;">
        You've joined <strong>${data.challengeTitle}</strong>. Log your progress and climb the leaderboard any time from the <strong>Challenges</strong> tab.
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="closeModal(); render('challenges');">See the leaderboard</button>
      </div>
    `);
  }catch(err){
    showToast("Couldn't join that challenge — try the link again");
  }
}

// Single place deciding what a person sees right after signing in, so the
// logic can't drift out of sync between the 3 places auth can succeed
// (existing session, fresh sign up, log in). The one rule that matters:
// if they arrived to accept an AB or challenge invite, that IS their
// orientation — showing the generic "set up your first goal" carousel on
// top of it (it's a higher z-index and was completely burying the real
// welcome screen) left brand-new ABs with no idea where they'd landed.
function proceedAfterAuth(){
  render('dashboard');
  if(pendingAcceptToken){
    processPendingInvite();
  } else if(pendingAcceptChallengeToken){
    processPendingChallengeInvite();
  } else {
    maybeShowOnboarding();
  }
}

async function submitSignUp(){
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit-btn');
  if(!name){ showAuthError('Enter your name'); return; }
  if(!email){ showAuthError('Enter your email'); return; }
  if(password.length < 6){ showAuthError('Password needs to be at least 6 characters'); return; }

  btn.disabled = true; btn.textContent = 'Creating account…';
  const { data, error } = await sbClient.auth.signUp({
    email, password,
    options: { data: {
      display_name: name,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    } }
  });
  if(error){ showAuthError(error.message); btn.disabled = false; btn.textContent = 'Create account'; return; }

  if(data.session){
    // Email confirmation is off for this project — signed in immediately.
    currentUser = data.session.user;
    hideAuthScreen();
    await loadGoalsFromSupabase();
    await loadSupportingRelationships();
    await loadMyAbInvites();
    await loadChallenges();
    await loadFuelfamLink();
    await loadRandomCelebrationPool();
    proceedAfterAuth();
  } else {
    // signUp() itself decided to withhold a session and would normally ask
    // for email confirmation here — but that decision is made by a
    // server-side setting independent of the database, and the
    // auto_confirm_email trigger has already stamped this account as
    // confirmed at the database level by the time we're even reading this
    // response. So rather than strand the person on a "check your email"
    // message for a confirmation step that isn't really blocking anything,
    // just log them in immediately with the same credentials they entered
    // — invisible to them, no dead end.
    const { data: loginData, error: loginErr } = await sbClient.auth.signInWithPassword({ email, password });
    if(loginData?.session){
      currentUser = loginData.session.user;
      hideAuthScreen();
      await loadGoalsFromSupabase();
      await loadSupportingRelationships();
      await loadMyAbInvites();
      await loadChallenges();
      await loadFuelfamLink();
      await loadRandomCelebrationPool();
      proceedAfterAuth();
    } else {
      // Genuinely could not get a session — now it's a real dead end worth
      // telling them about, rather than a silent gap.
      renderAuthCard('login', null, `Your account was created — try logging in with the email and password you just entered.`);
    }
  }
}

async function submitLogIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit-btn');
  if(!email || !password){ showAuthError('Enter your email and password'); return; }

  btn.disabled = true; btn.textContent = 'Logging in…';
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if(error){ showAuthError(error.message); btn.disabled = false; btn.textContent = 'Log in'; return; }

  currentUser = data.session.user;
  hideAuthScreen();
  await loadGoalsFromSupabase();
  await loadSupportingRelationships();
  await loadMyAbInvites();
  await loadChallenges();
  await loadFuelfamLink();
  await loadRandomCelebrationPool();
  proceedAfterAuth();
}

// ---------------------------------------------------------------------
// STREAK CELEBRATION — fires only at fixed milestones (1, 2, 3 days, 1
// week, 1 month, 3 months, 1 year), each with its own real branded video.
// Every other day just quietly updates the streak number with no popup —
// this replaced an earlier "celebrate every single completion" version.
//
// Fires immediately, inline with whatever action just completed a day —
// not on next page load — and queues rather than stacks: if someone logs
// several things in a row that each hit a milestone at once (e.g. two
// nutrition macros both cross "1 week" the same day), each gets its own
// popup, one after another, never overlapping.
// ---------------------------------------------------------------------
const STREAK_MILESTONES = [1, 2, 3, 7, 30, 90, 365];
const MILESTONE_VIDEO = {
  1:   'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-1.mp4',
  2:   'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-2.mp4',
  3:   'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-3.mp4',
  7:   'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-7.mp4',
  30:  'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-30.mp4',
  90:  'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-90.mp4',
  365: 'https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/milestone-365.mp4'
};
let celebrationQueue = [];
let celebrationShowing = false;
// Videos in Supabase Storage under assets/random/ — anything uploaded
// there becomes fair game for a non-milestone day's celebration. Loaded
// once at login (see the auth-load call sites) rather than per-check, so
// a normal completion doesn't cost a network round trip.
let randomCelebrationPool = null;
async function loadRandomCelebrationPool(){
  try{
    const { data, error } = await sbClient.storage.from('assets').list('random');
    if(error || !data){ randomCelebrationPool = []; return; }
    randomCelebrationPool = data
      .filter(f => f.name && /\.(mp4|mov|webm)$/i.test(f.name))
      .map(f => `https://kblaaqddfyhsoakxtgjx.supabase.co/storage/v1/object/public/assets/random/${f.name}`);
  }catch(e){ randomCelebrationPool = []; }
}
function pickRandomCelebrationVideo(){
  if(!randomCelebrationPool || randomCelebrationPool.length === 0) return null;
  return randomCelebrationPool[Math.floor(Math.random() * randomCelebrationPool.length)];
}
// `muted` reflects whether this celebration was triggered directly by a
// tap (mark done, log food/steps — sound is much more likely to be
// allowed by the browser right inside that click) versus a passive check
// on page load (withhold's streak, which can advance just from time
// passing with no click at all — browsers reliably block audio there).
// `unitWord`/`goalTitle` ride along purely so the in-popup Share button
// has what it needs — they don't affect which video plays.
// No setTimeout here on purpose — calling celebrateStreak() synchronously,
// in the same call stack as the tap that triggered it (mark done, log
// food/steps), is what lets the browser allow autoplay WITH sound. Any
// delay in between and the browser stops treating it as "you just did
// this," and silently blocks audio — that was the actual bug behind the
// muted-by-default behavior before.
function queueCelebration(opts){
  celebrationQueue.push(opts);
  if(!celebrationShowing) playNextCelebration();
}
function playNextCelebration(){
  if(celebrationShowing || !celebrationQueue.length) return;
  celebrationShowing = true;
  celebrateStreak(celebrationQueue.shift());
}
// opts: { type: 'milestone'|'random', num, forceMuted, unitWord, goalTitle }.
// Milestone videos carry their own branded messaging, so no banners there —
// the random pool is generic footage, so the goal name (top) and which day
// this is (bottom) are overlaid so it's still clear what's being celebrated.
function celebrateStreak(opts){
  opts = typeof opts === 'number' ? { type:'milestone', num: opts } : opts; // legacy positional call site (preview)
  const type = opts.type || 'milestone';
  const num = opts.num;
  const forceMuted = !!opts.forceMuted;
  const unitWord = opts.unitWord || 'day';
  const goalTitle = opts.goalTitle || '';
  const overlay = document.getElementById('celebration-overlay');
  const card = document.getElementById('celebration-card');
  const videoSrc = type === 'milestone' ? MILESTONE_VIDEO[num] : pickRandomCelebrationVideo();
  if(type === 'random' && !videoSrc){
    // Pool emptied out from under us (or never finished loading) — nothing
    // to show; move straight on rather than leave a broken card up.
    closeCelebration();
    return;
  }
  const shareBtn = `<button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="closeCelebration(); openShareSheet(${num}, '${unitWord}', ${jsAttr(goalTitle || '')});">Share this streak</button>`;
  const dayBannerText = `${unitWord.charAt(0).toUpperCase()+unitWord.slice(1)} ${num}`;
  const banners = type === 'random' ? `
    <div class="celebration-banner-top">${goalTitle}</div>
    <div class="celebration-banner-bottom">${dayBannerText}</div>
  ` : '';
  // Video celebrations go truly edge-to-edge (no card, no padding) — the
  // previous version wrapped the video in the same small modal-style card
  // used for confirm dialogs, which left visible backdrop on every side
  // even on a phone screen. The floating share button overlays the video
  // near the bottom rather than pushing it below, so the video itself
  // still fills the whole screen. object-fit:cover crops to fill rather
  // than letterboxing, which looks right as long as source clips are shot
  // roughly phone-portrait — worth knowing if a clip looks over-cropped.
  overlay.classList.toggle('video-mode', !!videoSrc);
  card.classList.toggle('video-mode', !!videoSrc);
  card.innerHTML = videoSrc ? `
    <div class="celebration-video-wrap fullscreen">
      ${banners}
      <button class="celebration-close-btn" onclick="closeCelebration()" aria-label="Close">✕</button>
      <video id="celebration-video" src="${videoSrc}" autoplay ${forceMuted ? 'muted' : ''} playsinline></video>
      <div class="celebration-floating-share">${shareBtn}</div>
    </div>
  ` : `
    <div class="streak-celebrate">
      <div class="streak-ripple r1"></div>
      <div class="streak-ripple r2"></div>
      <div class="streak-ripple r3"></div>
      <div class="streak-confetti">${confettiPiecesHtml()}</div>
      <div class="streak-badge">
        <div class="streak-badge-label">STREAK</div>
        <div class="streak-badge-num" data-target="${num}" style="color:${streakColor(num)};">0</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="closeCelebration()">Nice — keep going</button>
    ${shareBtn}
  `;
  overlay.style.display = 'flex';
  card.querySelectorAll('.streak-badge-num').forEach(el => {
    const target = parseInt(el.getAttribute('data-target')) || 0;
    const start = performance.now(), duration = 700;
    function tick(now){
      const p = Math.min(1, (now-start)/duration);
      el.textContent = Math.round(target * (1 - Math.pow(1-p, 3)));
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
  if(videoSrc){
    const vid = document.getElementById('celebration-video');
    // No auto-close on 'ended' anymore — the video just stops on its last
    // frame and stays on screen (banners included) until the person
    // dismisses it themselves, via the ✕, the share button, or tapping
    // the backdrop. Previously this force-closed the instant playback
    // finished, which didn't leave any time to actually read the banners.
    if(forceMuted){
      // Withhold's streak check fires passively when the log page renders,
      // not from a tap — there's no gesture to preserve, so don't even
      // attempt sound; go straight to muted with the fallback icon visible
      // immediately instead of a doomed unmuted attempt first.
      vid.play().catch(() => {});
      showSoundToggleIcon();
    } else {
      vid.play().catch(() => {
        // A real tap preceded this and the browser still blocked sound
        // anyway (happens occasionally, varies by browser) — fall back to
        // muted so the video still plays, with the icon as a recovery path.
        // If even that fails, leave the celebration up regardless — there's
        // no reason to auto-close it now that there's an explicit ✕; a
        // stuck-on-first-frame video with working close controls beats one
        // that vanishes on its own on a timer.
        vid.muted = true;
        vid.play().catch(() => {});
        showSoundToggleIcon();
      });
    }
  }
}
// Only added when sound genuinely didn't make it through automatically —
// not shown on every celebration, since most now play with sound already.
function showSoundToggleIcon(){
  const wrap = document.querySelector('.celebration-video-wrap');
  if(!wrap || document.getElementById('celebration-sound-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'celebration-sound-btn';
  btn.className = 'celebration-sound-btn';
  btn.textContent = '🔇';
  btn.setAttribute('aria-label', 'Turn sound on');
  btn.onclick = toggleCelebrationSound;
  wrap.appendChild(btn);
}
// Unmuting directly on a click is reliably allowed by every browser, unlike
// autoplay-with-sound — so this always works as the recovery path.
function toggleCelebrationSound(){
  const vid = document.getElementById('celebration-video');
  const btn = document.getElementById('celebration-sound-btn');
  if(!vid) return;
  vid.muted = !vid.muted;
  btn.textContent = vid.muted ? '🔇' : '🔊';
  btn.setAttribute('aria-label', vid.muted ? 'Turn sound on' : 'Turn sound off');
}
function closeCelebration(){
  const overlay = document.getElementById('celebration-overlay');
  const card = document.getElementById('celebration-card');
  const vid = document.getElementById('celebration-video');
  if(vid) vid.pause();
  overlay.style.display = 'none';
  overlay.classList.remove('video-mode');
  card.classList.remove('video-mode');
  celebrationShowing = false;
  // No delay here either — if another celebration is queued, this call
  // itself is (usually) inside a tap handler (closing via the button or
  // backdrop), so starting the next video right now keeps that same
  // gesture chain alive for its sound too.
  playNextCelebration();
}
function confettiPiecesHtml(){
  const colors = ['var(--green)', 'var(--green-light)', 'var(--navy)', 'var(--navy-soft)'];
  let html = '';
  for(let i=0;i<18;i++){
    const left = Math.round(Math.random()*94)+3;
    const delay = (Math.random()*0.35).toFixed(2);
    const dur = (1.1 + Math.random()*0.6).toFixed(2);
    const rotate = Math.round(Math.random()*360);
    html += `<span class="confetti-piece" style="left:${left}%; background:${colors[i % colors.length]}; animation-delay:${delay}s; animation-duration:${dur}s; transform:rotate(${rotate}deg);"></span>`;
  }
  return html;
}

// unitWordSingular should be e.g. "day", "week", "month", "year" (no count) —
// the card always shows "N DAYS" / "N WEEKS" etc regardless of N, unlike the
// in-app "1 Day" labels which stay singular for N=1.
function openShareSheet(streak, unitWordSingular, goalName){
  const plural = unitWordSingular.toUpperCase() + (streak === 1 ? '' : 'S');
  const card = document.getElementById('share-sheet-card');
  card.innerHTML = `
    <div class="share-sheet-preview">${shareCardHtml(streak, plural, goalName, false)}</div>
    <label class="share-sheet-toggle">
      <input type="checkbox" id="share-include-name">
      Include the name of the goal
    </label>
    <button class="btn btn-primary btn-block" onclick="renderAndShareCard(${streak}, '${plural}', ${jsAttr(goalName)})">Share</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="closeShareSheet()">Cancel</button>
  `;
  document.getElementById('share-include-name').addEventListener('change', (e) => {
    const preview = card.querySelector('.share-sheet-preview');
    preview.innerHTML = shareCardHtml(streak, plural, goalName, e.target.checked);
  });
  document.getElementById('share-sheet-overlay').style.display = 'flex';
}
function closeShareSheet(){
  document.getElementById('share-sheet-overlay').style.display = 'none';
}
async function renderAndShareCard(streak, plural, goalName){
  const includeName = document.getElementById('share-include-name').checked;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Preparing…';
  try{
    const offscreen = document.getElementById('share-card-offscreen');
    offscreen.innerHTML = shareCardHtml(streak, plural, goalName, includeName);
    // Real device pixel ratio so the shared image is crisp, not the CSS px size.
    const canvas = await html2canvas(offscreen.querySelector('.share-card'), {
      backgroundColor: '#F7F8F2', scale: Math.max(2, window.devicePixelRatio || 1)
    });
    offscreen.innerHTML = '';
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'my-streak.png', { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: 'My streak on GoRally' });
        }catch(err){
          if(err.name !== 'AbortError') showToast("Couldn't open the share sheet — image downloaded instead");
          downloadBlob(blob);
        }
      } else {
        downloadBlob(blob);
        showToast('Image downloaded — this browser has no share sheet');
      }
      closeShareSheet();
    }, 'image/png');
  }catch(err){
    showToast("Couldn't build the share image — try again");
    closeShareSheet();
  }
}
function downloadBlob(blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'my-streak.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// Withhold's streak advances by time passing, not by tapping something, so
// this stays a passive per-render check (see withholdLogCardHtml) rather
// than an inline trigger like the other goal types below — and its
// celebration always plays muted, since a passive page-load trigger is
// exactly the case browsers reliably block audio on.
function maybeCelebrateWithholdStreak(g, streak, slippedToday){
  if(slippedToday) return;
  checkAndCelebrate(g, 'withhold', streak, 'day', true);
  saveGoals();
}
// Shared once-per-milestone guard, keyed per metric so re-rendering or
// re-logging never re-fires the same milestone twice — and so a metric
// that's already past a milestone (e.g. day 50) doesn't pop anything,
// since only the exact STREAK_MILESTONES values ever queue a celebration.
// `muted` defaults to false (sound on) — pass true explicitly for anything
// that isn't triggered directly by a tap. `unitWord` feeds the in-popup
// Share button so it labels the card correctly (day/week/month).
function checkAndCelebrate(g, key, streakValue, unitWord, muted){
  if(!streakValue || streakValue <= 0) return; // a broken/zero streak is never a celebration
  g.streakCelebrations = g.streakCelebrations || {};
  if(STREAK_MILESTONES.includes(streakValue)){
    const milestoneKey = key + '_m' + streakValue;
    if(g.streakCelebrations[milestoneKey]) return;
    g.streakCelebrations[milestoneKey] = true;
    // Still mark it as seen even while hidden, so unhiding the goal later
    // doesn't suddenly replay a backlog of milestones it already passed
    // quietly — hidden just means no pop-up, not "this didn't happen."
    if(g.hidden) return;
    queueCelebration({ type:'milestone', num: streakValue, forceMuted: !!muted, unitWord, goalTitle: g.title });
    return;
  }
  // Every other completed day — a random pick from whatever's been
  // uploaded to assets/random/, so nothing goes uncelebrated. Silently
  // does nothing if that folder is still empty, same as before this
  // existed at all.
  if(!randomCelebrationPool || randomCelebrationPool.length === 0) return;
  const randomKey = key + '_r' + streakValue;
  if(g.streakCelebrations[randomKey]) return;
  g.streakCelebrations[randomKey] = true;
  if(g.hidden) return;
  queueCelebration({ type:'random', num: streakValue, forceMuted: !!muted, unitWord, goalTitle: g.title });
}
// Checks every enabled nutrition metric's current streak against the
// milestone list, right after a food/water log — per metric, not once for
// the whole goal, since each macro is its own independent streak. Only
// meaningful for today; logging or editing a past day never triggers a popup.
function checkNutritionCelebrations(g){
  if(currentLogDate !== todayKey()) return;
  g.metrics.filter(m => m.enabled).forEach(m => {
    checkAndCelebrate(g, 'nutri_' + m.key, nutritionMetricStreak(g, m), 'day');
  });
  saveGoals();
}

// ---------------------------------------------------------------------
// INLINE GUIDED TIPS — small dismissible callouts on the two parts of the
// creation flow that aren't self-explanatory (motivation
// mode / AB). Shown once per concept, then remembered via localStorage.
// ---------------------------------------------------------------------
function seenTip(key){ return localStorage.getItem('amigoal_tip_'+key) === '1'; }
function markTipSeen(key){ localStorage.setItem('amigoal_tip_'+key, '1'); }
function dismissTip(key){ markTipSeen(key); render(currentView); }
function tipCardHtml(key, text){
  if(seenTip(key)) return '';
  return `
    <div class="tip-card">
      <span class="tip-text">💡 ${text}</span>
      <button class="tip-dismiss" onclick="dismissTip('${key}')">Got it</button>
    </div>
  `;
}

// ---------------------------------------------------------------------
// RING ICON (target motif reused from the logo)
// ---------------------------------------------------------------------
function ringIcon(size, color, fillPct, showCheck){
  fillPct = fillPct === undefined ? 0 : fillPct;
  const r = (size/2) - 4;
  const c = size/2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - Math.min(1,fillPct));
  const complete = showCheck && fillPct >= 1;
  return `<span class="ring ${complete?'ring-complete':''}" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${r}" stroke="#E4E7DC" stroke-width="4"/>
      <circle cx="${c}" cy="${c}" r="${r}" stroke="${color}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${c} ${c})"/>
      <circle cx="${c}" cy="${c}" r="${Math.max(r-9,3)}" fill="${color}" opacity="0.12"/>
      ${complete ? `<path d="M${c-r*0.32} ${c} l${r*0.22} ${r*0.22} l${r*0.42} -${r*0.42}" stroke="${color}" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    </svg>
  </span>`;
}

// VISUAL HELPERS — per-metric color/emoji identity, and a keyword-based
// emoji guess for logged food items (so the food log feels less clinical).
// ---------------------------------------------------------------------
const METRIC_STYLE = {
  calories: { emoji:'🔥', color:'var(--c-calories)', soft:'var(--c-calories-soft)' },
  protein:  { emoji:'🥩', color:'var(--c-protein)',  soft:'var(--c-protein-soft)' },
  fat:      { emoji:'🥑', color:'var(--c-fat)',      soft:'var(--c-fat-soft)' },
  carbs:    { emoji:'🌾', color:'var(--c-carbs)',    soft:'var(--c-carbs-soft)' },
  water:    { emoji:'💧', color:'var(--c-water)',    soft:'var(--c-water-soft)' },
  steps:    { emoji:'👣', color:'var(--cat-steps)',  soft:'#E1EEFA' }
};
function metricStyle(key){
  return METRIC_STYLE[key] || { emoji:'📌', color:'var(--navy)', soft:'#EEF0F5' };
}
const CATEGORY_ACCENT = {
  nutrition: 'var(--cat-nutrition)',
  steps: 'var(--cat-steps)',
  withhold: 'var(--cat-withhold)',
  custom: 'var(--cat-custom)'
};
// Same colors as CATEGORY_ACCENT but as real hex, so JS can alpha-blend them
// (a CSS var() string can't be converted to rgba() at render time).
const CATEGORY_ACCENT_HEX = {
  nutrition: '#6FBF3E',
  steps: '#3E8FD6',
  withhold: '#1B2A54',
  custom: '#8B5FBF'
};
function withOpacity(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function animateCountUps(){
  document.querySelectorAll('.count-up').forEach(el => {
    const target = parseInt(el.getAttribute('data-target'))||0;
    if(target === 0){ el.textContent = '0'; return; }
    const duration = 600;
    const start = performance.now();
    function tick(now){
      const progress = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-progress, 3);
      el.textContent = Math.round(target * eased);
      if(progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
