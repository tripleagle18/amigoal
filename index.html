// ---------------------------------------------------------------------
// RING ICON (target motif reused from the logo)
// ---------------------------------------------------------------------
function ringIcon(size, color, fillPct, showCheck){
  fillPct = fillPct === undefined ? 0 : fillPct;
  const r = (size/2) - 4;
  const c = size/2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - Math.min(1,fillPct));
  const complete = showCheck && fillPct >= 1;
  return `<span class="ring ${complete?'ring-complete':''}" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${r}" stroke="#E4E7DC" stroke-width="4"/>
      <circle cx="${c}" cy="${c}" r="${r}" stroke="${color}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${c} ${c})"/>
      <circle cx="${c}" cy="${c}" r="${Math.max(r-9,3)}" fill="${color}" opacity="0.12"/>
      ${complete ? `<path d="M${c-r*0.32} ${c} l${r*0.22} ${r*0.22} l${r*0.42} -${r*0.42}" stroke="${color}" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    </svg>
  </span>`;
}

// Same colors as CATEGORY_ACCENT but as real hex, so JS can alpha-blend them

  const h = hex.replace('#','');

function animateCountUps(){
  document.querySelectorAll('.count-up').forEach(el => {
    const target = parseInt(el.getAttribute('data-target'))||0;
    if(target === 0){ el.textContent = '0'; return; }
    const duration = 600;
    const start = performance.now();
    function tick(now){
      const progress = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-progress, 3);
      el.textContent = Math.round(target * eased);
      if(progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// ---------------------------------------------------------------------
// AB DIGEST — batches invites per contact so one person who's an AB on
// several goals gets a single end-of-day email/text, not one per goal.
// ---------------------------------------------------------------------
function forEachAb(callback){
  goals.forEach(g => {
    g.metrics.forEach(m => {
      (m.abs||[]).forEach(ab => callback(ab, m, g));
    });
  });
}
function countAbsByStatus(status){
  let n = 0;
  forEachAb(ab => { if(ab.status === status) n++; });
  return n;
}
function groupAbsByContact(statuses){
  const groups = {}; // key: type|value
  forEachAb((ab, m, g) => {
    if(!statuses.includes(ab.status)) return;
    const key = ab.type + '|' + ab.value;
    if(!groups[key]) groups[key] = { type: ab.type, value: ab.value, items: [] };
    groups[key].items.push({ ab, metric: m, goal: g });
  });
  return groups;
}
function sendDailyDigest(){
  if(!currentUserName){
    promptModal('What name should show in your AB invites?', {
      value: '', placeholder: 'Your first name',
      onConfirm: (val) => {
        if(!val || !val.trim()){ showToast('Name is required to send invites'); return; }
        currentUserName = val.trim();
        localStorage.setItem('amigoal_user_name_demo', currentUserName);
        doSendDailyDigest();
      }
    });
    return;
  }
  doSendDailyDigest();
}
function doSendDailyDigest(){
  let n = 0;
  forEachAb(ab => { if(ab.status === 'queued'){ ab.status = 'awaiting'; n++; } });
  saveGoals();
  const groups = groupAbsByContact(['awaiting']);
  const uniqueContacts = Object.keys(groups).length;
  showToast(`Sent ${uniqueContacts} digest ${uniqueContacts===1?'message':'messages'} (${n} invite${n===1?'':'s'} total)`);
  render('digest-preview');
}
function viewDigestPreview(){
  const groups = groupAbsByContact(['awaiting','accepted']);
  const keys = Object.keys(groups);
  const fromName = currentUserName || 'You';
  return `
    <div class="wizard-head">
      <div class="back-btn" onclick="goHome()">${chevron()}</div>
      <div>
        <div class="step-title">Sent invites</div>
        <div class="step-sub">What each accountability buddy received, batched by person.</div>
      </div>
    </div>

    ${keys.length === 0 ? `<div class="empty-state"><p>Nothing sent yet.</p></div>` : keys.map(k => {
      const grp = groups[k];
      return `

          <div class="to">To: ${grp.value} (${grp.type})</div>
          <div class="subject">Hi ${grp.items[0].ab.firstName} — ${fromName} wants you to be their Accountability Buddy</div>
          ${grp.items.map(it => `
            <div class="digest-goal-row">
              <div class="g"><strong>${it.goal.title}</strong>${it.metric.label}</div>
              ${it.ab.status === 'accepted'
                ? `<span class="status-badge status-accepted">Accepted</span>`
                : `<button class="btn btn-ghost" style="padding:8px 14px; font-size:12.5px;" onclick="simulateAbAccept('${it.goal.id}','${it.metric.key}','${k.replace(/'/g,"\\'")}')">Simulate accept</button>`
              }
            </div>
          `).join('')}

      `;
    }).join('')}
    ${keys.length ? `<div style="text-align:center; margin-top:6px; font-size:12.5px; color:var(--muted); line-height:1.5;">"Simulate accept" stands in for the AB tapping Accept on their end — it's here so you can see the notification it triggers.</div>` : ''}
  `;
}
function simulateAbAccept(goalId, metricKey, contactKey){
  const goal = goals.find(g => g.id === goalId);
  if(!goal) return;
  const metric = goal.metrics.find(m => m.key === metricKey);
  if(!metric) return;
  const [type, value] = contactKey.split('|');
  const ab = (metric.abs||[]).find(a => a.type===type && a.value===value);
  if(!ab) return;
  ab.status = 'accepted';
  saveGoals();
  addNotification(`<strong>${ab.firstName}</strong> accepted being your accountability buddy for <strong>${goal.title} — ${metric.label}</strong>.`);
  showToast('Notification sent to you 🎉');
  render('digest-preview');
}

// One consistent way to word every streak headline in the app:
// "{N} Day(s) 🔥 [Label ]Streak" — the unit noun (Day/Week/Month/Period)
// matches whatever the streak is actually counted in, since a weekly
// custom goal's streak is weeks, not days.
function streakUnitNoun(periodLabel, count){
  const noun = periodLabel === 'week' ? 'Week' : periodLabel === 'month' ? 'Month' : periodLabel === 'custom' ? 'Period' : 'Day';
  return noun + (count === 1 ? '' : 's');
}
// Same mapping as streakUnitNoun, but lowercase singular — what the share
// card's openShareSheet()/celebrateStreak() expect before they pluralize.
function shareUnitWord(periodLabel){
  return periodLabel === 'week' ? 'week' : periodLabel === 'month' ? 'month' : periodLabel === 'custom' ? 'period' : 'day';
}
// JSON.stringify produces a double-quoted JS string literal — dropping that
// straight into onclick="..." (also double-quoted) truncates the attribute
// at the string's first internal quote, silently breaking the handler.
// This HTML-entity-encodes those quotes so the attribute parses correctly;
// the browser decodes &quot; back to " before JS ever sees it.
function jsAttr(str){
  return JSON.stringify(str || '').replace(/"/g, '&quot;');
}
function streakLabel(count, periodLabel, label){
  return `${streakUnitNoun(periodLabel, count)} 🔥 ${label ? label + ' ' : ''}Streak`;
}
function goalCardHtml(g){
  ensureLogArrays(g);
  const accent = CATEGORY_ACCENT[g.category] || 'var(--navy)';
  if(g.category === 'withhold'){
    const streak = withholdStreakDays(g);
    const sColor = streakColor(streak);
    return `
      <div class="goal-card" style="border-left: 4px solid ${sColor}; border-top-left-radius:6px; border-bottom-left-radius:6px;" onclick="openGoalStatsModal(${jsAttr(g.id)})">
        <div>${ringIcon(48, sColor, Math.min(1, streak/30))}</div>
        <div class="info">
          <h3>${g.title}</h3>
          <div class="streak-headline" style="color:${sColor};">
            <span class="streak-headline-num count-up" data-target="${streak}">0</span>
            <span class="streak-headline-word">${streakLabel(streak, 'day')}</span>
            ${streak > 0 ? `<button class="streak-share-btn" style="color:${sColor};" onclick="event.stopPropagation(); openShareSheet(${streak}, 'day', ${jsAttr(g.title)})" aria-label="Share streak">🔗</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }
  const enabledMetrics = g.metrics.filter(m => m.enabled);
  const pct = goalProgressPct(g);
  let headline = null;
  if(g.category === 'nutrition'){
    const best = bestNutritionStreak(g);
    if(best) headline = { streak: best.streak, word: streakLabel(best.streak, 'day', best.metric.label), unit: 'day' };
  } else if(g.category === 'steps'){
    const m = g.metrics[0];
    const s = stepsStreak(g);
    const rawPeriod = m.stepsMode === 'daily' ? 'day' : m.periodLabel;
    if(s > 0) headline = { streak: s, word: streakLabel(s, rawPeriod, 'Steps'), unit: shareUnitWord(rawPeriod) };
  } else if(g.category === 'custom'){
    const m = g.metrics[0];
    const s = customStreak(g);
    if(s > 0) headline = { streak: s, word: streakLabel(s, m.periodLabel), unit: shareUnitWord(m.periodLabel) };
  }
  const hColor = headline ? streakColor(headline.streak) : accent;

  return `
    <div class="goal-card" style="border-left: 4px solid ${accent}; border-top-left-radius:6px; border-bottom-left-radius:6px;" onclick="openGoalStatsModal(${jsAttr(g.id)})">
      <div>${ringIcon(48, accent, pct/100, true)}</div>
      <div class="info">
        <h3>${g.title}</h3>
        ${headline && headline.streak > 0 ? `
          <div class="streak-headline" style="color:${hColor};">
            <span class="streak-headline-num count-up" data-target="${headline.streak}">0</span>
            <span class="streak-headline-word">${headline.word}</span>
            <button class="streak-share-btn" style="color:${hColor};" onclick="event.stopPropagation(); openShareSheet(${headline.streak}, '${headline.unit}', ${jsAttr(g.title)})" aria-label="Share streak">🔗</button>
          </div>
        ` : `<div class="meta">${enabledMetrics.map(m => m.label).join(' · ') || 'No metrics enabled'}</div>`}
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${accent};"></div></div>
          <div class="progress-label">
            <span>${progressLabelText(g, pct)}</span>
            <span class="pct" style="${pct>=100?'color:var(--green-deep);':''}">${pct}%${pct>=100?' ✅':''}</span>
          </div>
        </div>
      </div>
    </div>
  `;
}
function progressLabelText(g, pct){
  const periodWord = g.category === 'nutrition' ? 'today'
    : (g.metrics[0].periodLabel === 'day' ? 'today' : (g.metrics[0].periodLabel === 'month' ? 'this month' : (g.metrics[0].periodLabel === 'custom' ? 'this period' : 'this week')));
  return pct > 0 ? `Progress ${periodWord}` : `Nothing logged yet ${periodWord}`;
}
// ---------------------------------------------------------------------
// DATE / PERIOD HELPERS — local-timezone date math (per the "user's own
// device timezone" decision). Used by both progress calculation and the
// Log page itself.
// ---------------------------------------------------------------------
function dateKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayKey(){ return dateKey(new Date()); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day); // back to Monday
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  monday.setDate(monday.getDate() + diff);
  return monday;
}
// Returns the current period's [start,end] date-keys for a steps/custom metric.
function getPeriodWindow(goal, metric, refDateStr){
  const refDate = refDateStr ? parseDateKey(refDateStr) : new Date();
  const period = metric.periodLabel;
  if(period === 'week'){
    const start = startOfWeek(refDate);
    return { start: dateKey(start), end: dateKey(addDays(start,6)) };
  }
  if(period === 'month'){
    const start = new Date(refDate.getFullYear(), refDate.getMonth(), 1);
    const end = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0);
    return { start: dateKey(start), end: dateKey(end) };
  }
  if(period === 'custom'){
    const days = parseInt(metric.customDays)||7;
    const anchor = new Date(goal.createdAt || Date.now());
    const diffDays = Math.floor((refDate - anchor) / 86400000);
    const periodIndex = Math.floor(diffDays / days);
    const start = addDays(anchor, periodIndex*days);
    return { start: dateKey(start), end: dateKey(addDays(start, days-1)) };
  }
  // 'day' (or unset) — just the reference day
  const k = dateKey(refDate);
  return { start: k, end: k };
}
function parseDateKey(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function sumInRange(entries, start, end, field){
  return (entries||[]).filter(e => e.date >= start && e.date <= end)
    .reduce((s,e) => s + (parseFloat(e[field !== undefined ? field : 'value']) || 0), 0);
}
function countDaysInRange(entries, start, end){
  const days = new Set((entries||[]).filter(e => e.date >= start && e.date <= end).map(e => e.date));
  return days.size;
}
function ensureLogArrays(g){
  if(!g.foodLog) g.foodLog = [];
  if(!g.waterLog) g.waterLog = [];
  if(!g.stepsLog) g.stepsLog = [];
  if(!g.customLog) g.customLog = [];
  if(!g.slipLog) g.slipLog = [];
}

// Days since the most recent slip (or since goal creation if no slips yet),
// measured up to (and including) refDateStr — defaults to today.
function withholdStreakDays(g, refDateStr){
  const refDate = refDateStr ? parseDateKey(refDateStr) : new Date();
  const slips = (g.slipLog||[]).filter(e => e.date <= dateKey(refDate)).map(e => e.date).sort();
  const lastSlip = slips.length ? parseDateKey(slips[slips.length-1]) : new Date(g.createdAt || Date.now());
  const days = Math.floor((refDate - lastSlip) / 86400000);
  return Math.max(0, days);
}
// The streak number's color deepens as it climbs — a small "this is getting
// real" visual cue without needing the full milestone/badge system yet.
function streakColor(days){
  if(days >= 90) return '#8B5FBF';   // deep purple — the long haul
  if(days >= 30) return '#C99A2E';   // gold — a full month+
  if(days >= 7)  return '#4C9427';   // deep green — a solid week+
  return '#6FBF3E';                  // starting green
}

// Generic "consecutive days hitting a daily target" streak — counts back
// from yesterday, then adds today if it's already met (a day in progress
// can extend the streak, it just can't break it until the day is over).
// Shared by nutrition per-macro streaks and steps' "daily" mode below.
function dailyTargetStreak(getDayValue, createdAt, target){
  if(target <= 0) return 0;
  const earliest = createdAt ? dateKey(new Date(createdAt)) : todayKey();
  let count = 0;
  let cursor = addDays(new Date(), -1);
  while(dateKey(cursor) >= earliest){
    if(getDayValue(dateKey(cursor)) >= target){ count++; cursor = addDays(cursor, -1); }
    else break;
  }
  if(getDayValue(todayKey()) >= target) count++;
  return count;
}
// Generic "consecutive completed periods" streak — for goals whose target
// is measured over a whole period (a week, a month, a custom span) rather
// than a single day. Same "in-progress period can't break it" logic as
// above, just one period-window at a time instead of one day at a time.
// Bounded to 500 periods back so a bug in period math can't hang the tab.
function periodTargetStreak(g, m, achievedInWindow){
  const target = parseFloat(m.value) || 0;
  if(target <= 0) return 0;
  const earliestDate = g.createdAt ? new Date(g.createdAt) : new Date();
  let count = 0;
  let cursorDate = new Date();
  for(let i = 0; i < 500; i++){
    const win = getPeriodWindow(g, m, dateKey(cursorDate));
    const achieved = achievedInWindow(win);
    const periodStillOpen = win.end >= todayKey();
    if(achieved >= target) count++;
    else if(!periodStillOpen) break;
    const prevPeriodRef = addDays(parseDateKey(win.start), -1);
    if(prevPeriodRef < earliestDate) break;
    cursorDate = prevPeriodRef;
  }
  return count;
}

// Per-macro streak (calories/protein/fat/carbs/water each get their own —
// hitting your protein target ten days running is a real, separate streak
// from hitting water, even on the same nutrition goal).
function nutritionMetricDailyValue(g, key, dateStr){
  return key === 'water' ? waterTotalOnDate(g, dateStr) : (foodTotalsOnDate(g, dateStr)[key] || 0);
}
function nutritionMetricStreak(g, m){
  return dailyTargetStreak(date => nutritionMetricDailyValue(g, m.key, date), g.createdAt, parseFloat(m.value) || 0);
}
// Best current streak among a nutrition goal's enabled metrics — used as
// the one-line dashboard headline, since a card can't show five numbers.
function bestNutritionStreak(g){
  const enabled = g.metrics.filter(m => m.enabled && parseFloat(m.value) > 0);
  let best = null;
  enabled.forEach(m => {
    const streak = nutritionMetricStreak(g, m);
    if(!best || streak > best.streak) best = { metric: m, streak };
  });
  return best;
}
// Steps: "daily" mode needs the target hit every single day (daily streak);
// "cumulative" mode needs the running total to hit target once per whole
// period (period streak), regardless of how the period's check-in cadence
// is set.
function stepsStreak(g){
  const m = g.metrics[0];
  if(m.stepsMode === 'daily'){
    return dailyTargetStreak(date => sumInRange(g.stepsLog, date, date, 'value'), g.createdAt, parseFloat(m.value) || 0);
  }
  return periodTargetStreak(g, m, win => sumInRange(g.stepsLog, win.start, win.end, 'value'));
}
// Custom: a period streak using the same "X of Y this period" count the
// log page already shows — a period='day', target=1 goal collapses to a
// plain daily habit streak automatically.
function customStreak(g){
  const m = g.metrics[0];
  return periodTargetStreak(g, m, win => countDaysInRange(g.customLog, win.start, win.end));
}

// ---------------------------------------------------------------------
// LONGEST-EVER STREAKS — nothing above tracks a "best streak," it only
// ever counts backward from today and stops at the first break. These
// scan the goal's full history instead, for the goal stats modal. Not
// cheap to recompute on every render, but goal lifespans are small
// enough (days/weeks/months, not years of daily data) that a full scan
// on modal-open is instant in practice.
// ---------------------------------------------------------------------
function longestDailyTargetStreak(getDayValue, createdAt, target){
  if(target <= 0) return 0;
  const endKey = todayKey();
  let cursor = createdAt ? new Date(createdAt) : new Date();
  let best = 0, running = 0;
  while(dateKey(cursor) <= endKey){
    if(getDayValue(dateKey(cursor)) >= target){ running++; if(running > best) best = running; }
    else running = 0;
    cursor = addDays(cursor, 1);
  }
  return best;
}
// Same "full scan" idea as longestDailyTargetStreak, one period-window at
// a time going forward from creation, using the same window math the
// current-streak version relies on. Bounded to 500 periods, same as
// periodTargetStreak, so a period-math bug can't hang the tab.
function longestPeriodTargetStreak(g, m, achievedInWindow){
  const target = parseFloat(m.value) || 0;
  if(target <= 0) return 0;
  const todayK = todayKey();
  let cursorDate = g.createdAt ? new Date(g.createdAt) : new Date();
  let best = 0, running = 0;
  for(let i = 0; i < 500; i++){
    const win = getPeriodWindow(g, m, dateKey(cursorDate));
    const achieved = achievedInWindow(win);
    const periodStillOpen = win.end >= todayK;
    if(achieved >= target){ running++; if(running > best) best = running; }
    else if(!periodStillOpen) running = 0;
    if(periodStillOpen) break; // reached the current, possibly in-progress period
    cursorDate = addDays(parseDateKey(win.end), 1);
  }
  return best;
}
function longestNutritionMetricStreak(g, m){
  return longestDailyTargetStreak(date => nutritionMetricDailyValue(g, m.key, date), g.createdAt, parseFloat(m.value) || 0);
}
function longestStepsStreak(g){
  const m = g.metrics[0];
  if(m.stepsMode === 'daily'){
    return longestDailyTargetStreak(date => sumInRange(g.stepsLog, date, date, 'value'), g.createdAt, parseFloat(m.value) || 0);
  }
  return longestPeriodTargetStreak(g, m, win => sumInRange(g.stepsLog, win.start, win.end, 'value'));
}
function longestCustomStreak(g){
  const m = g.metrics[0];
  return longestPeriodTargetStreak(g, m, win => countDaysInRange(g.customLog, win.start, win.end));
}
// Longest-ever gap without a slip — the longest run between two
// consecutive slips (or from goal creation to the first slip, or from
// the last slip to today, whichever span is longest). Reuses
// withholdStreakDays' own "days up to a reference date" math at each
// slip boundary rather than duplicating it.
function longestWithholdStreak(g){
  const slips = (g.slipLog||[]).map(e => e.date).sort();
  let prevBoundary = parseDateKey(dateKey(new Date(g.createdAt || Date.now())));
  let best = 0;
  slips.forEach(dateStr => {
    const slipDate = parseDateKey(dateStr);
    const days = Math.max(0, Math.floor((slipDate - prevBoundary) / 86400000));
    if(days > best) best = days;
    prevBoundary = slipDate;
  });
  const current = withholdStreakDays(g);
  if(current > best) best = current;
  return best;
}

function todayFoodTotals(g){
  const t = todayKey();
  const entries = (g.foodLog||[]).filter(e => e.date === t);
  return {
    calories: entries.reduce((s,e)=>s+(e.calories||0),0),
    protein: entries.reduce((s,e)=>s+(e.protein||0),0),
    fat: entries.reduce((s,e)=>s+(e.fat||0),0),
    carbs: entries.reduce((s,e)=>s+(e.carbs||0),0)
  };
}
function todayWaterTotal(g){ return sumInRange(g.waterLog, todayKey(), todayKey(), 'amount'); }

// Date-scoped versions used by the Log page's day browser (any date, not just today)
function foodTotalsOnDate(g, dateStr){
  const entries = (g.foodLog||[]).filter(e => e.date === dateStr);
  return {
    calories: entries.reduce((s,e)=>s+(e.calories||0),0),
    protein: entries.reduce((s,e)=>s+(e.protein||0),0),
    fat: entries.reduce((s,e)=>s+(e.fat||0),0),
    carbs: entries.reduce((s,e)=>s+(e.carbs||0),0)
  };
}
function waterTotalOnDate(g, dateStr){ return sumInRange(g.waterLog, dateStr, dateStr, 'amount'); }

function goalProgressPct(g){
  ensureLogArrays(g);
  if(g.category === 'nutrition'){
    const totals = todayFoodTotals(g);
    const water = todayWaterTotal(g);
    const enabled = g.metrics.filter(m => m.enabled);
    if(!enabled.length) return 0;
    let sum = 0, count = 0;
    enabled.forEach(m => {
      const val = m.key === 'water' ? water : (totals[m.key]||0);
      const target = parseFloat(m.value)||0;
      if(target <= 0) return;
      sum += Math.min(100, (val/target)*100);
      count++;
    });
    return count ? Math.round(sum/count) : 0;
  }
  if(g.category === 'steps'){
    const m = g.metrics[0];
    const win = getPeriodWindow(g, m);
    const total = m.stepsMode === 'daily'
      ? sumInRange(g.stepsLog, todayKey(), todayKey(), 'value')
      : sumInRange(g.stepsLog, win.start, win.end, 'value');
    const target = parseFloat(m.value)||0;
    return target > 0 ? Math.min(100, Math.round((total/target)*100)) : 0;
  }
  if(g.category === 'custom'){
    const m = g.metrics[0];
    const win = getPeriodWindow(g, m);
    const count = countDaysInRange(g.customLog, win.start, win.end);
    const target = parseInt(m.value)||1;
    return Math.min(100, Math.round((count/target)*100));
  }
  if(g.category === 'withhold'){
    // Symbolic scale: ring fills toward a 30-day milestone, then stays full.
    const streak = withholdStreakDays(g);
    return Math.min(100, Math.round((streak/30)*100));
  }
  return 0;
}

// ---------------------------------------------------------------------
// DRI CALCULATOR — 2023 NASEM EER equations, AMDR-based macro split,
// weight-based drinking-water target.
//
// NOTE ON ASSUMPTIONS (flagged for review):
//  • EER equations below are the 2023 National Academies adult (19+)
//    equations — the current replacement for the older 2005 IOM formulas.
//  • Macro split uses 25% protein / 30% fat / 45% carbs of calories as the
//    baseline (within AMDR ranges of 10–35% / 20–35% / 45–65%). "Lose"
//    recalculates all four from the reduced calorie number, so macros
//    scale down with the deficit. "Gain" keeps calories at maintenance
//    (no surplus was specified) and adds 20% to protein only, per spec.
//  • Water target is drinking water only (not water from food), calculated
//    as 35 ml per kg of body weight — a commonly used clinical estimate —
//    rather than the flat IOM Adequate Intake, since that doesn't scale
//    with weight and a weight-based number was requested.
//  • Pregnancy/breastfeeding: applies the standard trimester/lactation
//    calorie add-ons (roughly +340/+452 kcal for pregnancy trimesters 2/3,
//    +330/+400 kcal for early/later breastfeeding) as a reasonable
//    approximation — worth a closer look before this ships for real users.
// ---------------------------------------------------------------------
function calculateDRI(d){
  let heightCm, weightKg;
  if(nutritionUnits === 'us'){
    const totalIn = (parseFloat(d.heightFt)||0)*12 + (parseFloat(d.heightIn)||0);
    heightCm = totalIn * 2.54;
    weightKg = (parseFloat(d.weightLb)||0) / 2.20462;
  } else {
    heightCm = parseFloat(d.heightCm)||0;
    weightKg = parseFloat(d.weightKg)||0;
  }
  const age = parseFloat(d.age)||0;

  const coeffs = {
    male: {
      inactive:   { k:753.07,  a:10.83, h:6.50,  w:14.10 },
      low_active: { k:581.47,  a:10.83, h:8.30,  w:14.94 },
      active:     { k:1004.82, a:10.83, h:6.52,  w:15.91 },
      very_active:{ k:-517.88, a:10.83, h:15.61, w:19.11 }
    },
    female: {
      inactive:   { k:584.90, a:7.01, h:5.72, w:11.71 },
      low_active: { k:575.77, a:7.01, h:6.60, w:12.14 },
      active:     { k:710.25, a:7.01, h:6.54, w:12.34 },
      very_active:{ k:511.83, a:7.01, h:9.07, w:12.56 }
    }
  };
  const c = coeffs[d.sex][d.activity];
  let eer = c.k - (c.a * age) + (c.h * heightCm) + (c.w * weightKg);

  // Pregnancy / breastfeeding add-ons (approximate, second/third-trimester and
  // lactation averages — flagged above as worth a closer look before shipping).
  if(d.pregnancy === 'pregnant') eer += 400;
  if(d.pregnancy === 'bf_early') eer += 330;
  if(d.pregnancy === 'bf_late') eer += 400;

  const maintenanceCalories = Math.round(eer);
  let calories = maintenanceCalories;
  if(d.direction === 'lose') calories = Math.max(1200, maintenanceCalories - 500);
  if(d.direction === 'gain') calories = maintenanceCalories + 300;

  // Macro split off the *active* calorie target (so "lose" scales macros down too)
  const proteinCalPct = 0.25, fatCalPct = 0.30, carbCalPct = 0.45;
  let proteinG = Math.round((calories * proteinCalPct) / 4);
  let fatG = Math.round((calories * fatCalPct) / 9);
  let carbG = Math.round((calories * carbCalPct) / 4);

  if(d.direction === 'gain'){
    proteinG = Math.round(proteinG * 1.2);
  }

  const waterMl = Math.round(weightKg * 35);
  const waterOz = Math.round(waterMl / 29.5735);

  return {
    calories, proteinG, fatG, carbG,
    waterOz, waterMl,
    maintenanceCalories,
    weightKg: Math.round(weightKg*10)/10
  };
}

function calculateAndContinue(){
  const result = calculateDRI(draft);
  draft.driResult = result;
  draft.nutritionInputs = {

    { key:'protein', label:'Protein', unit:'g', value: result.proteinG, originalValue: result.proteinG, enabled:true, motivation:false, abs:[] },
    { key:'fat', label:'Fat', unit:'g', value: result.fatG, originalValue: result.fatG, enabled:true, motivation:false, abs:[] },

// Builds the goal_metrics rows Supabase expects from the client's draft
// metrics array — see the mapping comments near loadGoalsFromSupabase for
// why the shapes differ (schema designed independently of the prototype).
function buildMetricRows(category, metrics){
  return metrics.map(m => {
    const metric_type = clientMetricKeyToDb(m.key);
    const row = {
      metric_type,
      enabled: !!m.enabled,
      motivation_mode_enabled: !!m.motivation,
      target_count_per_period: 1,
      target_value: null, unit: null, steps_mode: null
    };
    if(metric_type === 'custom_activity'){
      row.target_count_per_period = parseInt(m.value) || 1;
    } else if(metric_type === 'withhold'){
      // target_value/unit intentionally left null — see goal_metrics comment
    } else if(metric_type === 'steps'){
      row.target_value = parseFloat(m.value) || 0;
      row.unit = 'steps';
      row.steps_mode = m.stepsMode || 'daily';
    } else {
      // nutrition macros: calories/protein/fat/carbs/water
      row.target_value = parseFloat(m.value) || 0;
      row.unit = m.unit;
    }
    return row;
  });
}
function nutritionProfilePayload(goalId){
  const heightCm = nutritionUnits === 'us'
    ? ((parseFloat(draft.heightFt)||0)*12 + (parseFloat(draft.heightIn)||0)) * 2.54
    : parseFloat(draft.heightCm) || 0;
  const weightKg = nutritionUnits === 'us'
    ? (parseFloat(draft.weightLb)||0) / 2.20462
    : parseFloat(draft.weightKg) || 0;
  const dri = draft.driResult || calculateDRI(draft);
  return {
    goal_id: goalId,
    sex: draft.sex, age_years: parseInt(draft.age) || 0,
    height_cm: Math.round(heightCm*10)/10, weight_kg: Math.round(weightKg*10)/10,
    activity_level: draft.activity,
    pregnancy_status: clientPregnancyToDb(draft.pregnancy || 'none'),
    goal_direction: draft.direction,
    target_weight_kg: draft.targetWeight
      ? (nutritionUnits === 'us' ? parseFloat(draft.targetWeight)/2.20462 : parseFloat(draft.targetWeight))
      : null,
    calculated_calories: dri.calories, calculated_protein_g: dri.proteinG,
    calculated_fat_g: dri.fatG, calculated_carbs_g: dri.carbG, calculated_water_ml: dri.waterMl,
    dri_formula_version: 'nasem_2023'
  };
}
// Editing an existing goal: update it in place rather than creating a
// second one. Logs, id, and createdAt are preserved. Goals are open-ended
// (no duration/end date) — someone building a long streak shouldn't have
// to recreate the goal just to keep it going.
//
// Metrics are replaced wholesale (delete then reinsert) rather than
// individually diffed — safe for now since nothing else yet references a
// specific goal_metric_id (AB relationships and logging against real
// metric rows are later phases); this will need to become a real
// upsert-by-metric_type once those foreign keys exist.
async function saveGoalAndFinish(titleOverride){
  const title = titleOverride || draft.title || 'New goal';
  const category = draft.category;

  let periodType = 'daily', customPeriodDays = null;
  if(category !== 'nutrition'){
    const pl = draft.metrics[0].periodLabel || 'day';
    periodType = clientPeriodToDb(pl);
    if(pl === 'custom') customPeriodDays = parseInt(draft.metrics[0].customDays) || null;
  }

  if(draft.editingGoalId){
    const goalId = draft.editingGoalId;
    showToast('Saving changes…');
    const { error: gErr } = await sbClient.from('goals').update({
      label: title, period_type: periodType, custom_period_days: customPeriodDays
    }).eq('id', goalId);
    if(gErr){ showToast("Couldn't save — " + gErr.message); return; }

    // Upsert by (goal_id, metric_type) rather than delete-then-reinsert —
    // the metric_type set never actually changes for a given category, so
    // this updates existing rows in place instead of destroying and
    // recreating their ids. That matters now that ab_relationships and
    // goal_metric_logs point at those exact ids: a delete+reinsert here
    // would silently orphan/cascade-delete a real accepted AB connection
    // or someone's logged history the moment you edited anything else on
    // the goal.
    const metricRows = buildMetricRows(category, draft.metrics).map(r => Object.assign({}, r, { goal_id: goalId }));
    const { data: savedMetrics, error: mErr } = await sbClient.from('goal_metrics')
      .upsert(metricRows, { onConflict: 'goal_id,metric_type' }).select();
    if(mErr){ showToast("Couldn't save metrics — " + mErr.message); return; }

    if(category === 'nutrition'){
      const { error: npErr } = await sbClient.from('nutrition_profiles')
        .upsert(nutritionProfilePayload(goalId), { onConflict: 'goal_id' });
      if(npErr){ showToast("Couldn't save nutrition details — " + npErr.message); return; }
    }

    await createPendingAbInvites(savedMetrics);
    await loadGoalsFromSupabase();
    showToast('Goal updated');
    draft = null;
    render('profile');
    return;
  }

  showToast('Saving goal…');
  const { data: goalRow, error: gErr } = await sbClient.from('goals').insert({
    user_id: currentUser.id, category: clientCategoryToDb(category), label: title,
    period_type: periodType, custom_period_days: customPeriodDays
  }).select().single();
  if(gErr){ showToast("Couldn't save — " + gErr.message); return; }

  const metricRows = buildMetricRows(category, draft.metrics).map(r => Object.assign({}, r, { goal_id: goalRow.id }));
  const { data: savedMetrics, error: mErr } = await sbClient.from('goal_metrics').insert(metricRows).select();
  if(mErr){ showToast("Couldn't save metrics — " + mErr.message); return; }

  if(category === 'nutrition'){
    const { error: npErr } = await sbClient.from('nutrition_profiles').insert(nutritionProfilePayload(goalRow.id));
    if(npErr){ showToast("Couldn't save nutrition details — " + npErr.message); return; }
  }

  await createPendingAbInvites(savedMetrics);
  await loadGoalsFromSupabase();
  showToast('Goal saved 🎉');
  draft = null;
  render('dashboard');
}

// Sends a real invite for every AB still sitting in draft's local
// 'queued' state — the wizard stages ABs locally as they're added (see
// addAb()) since a brand-new goal has no real goal_metric_id yet to
// attach an invite to; this is the one place that actually creates the
// real ab_invites row once real ids exist, for both a new goal and an
// edit. Creating the row is what fires the invite email automatically
// (see the on_ab_invite_created trigger) — nothing here sends email directly.
async function createPendingAbInvites(savedMetricRows){
  const byClientKey = Object.fromEntries(savedMetricRows.map(r => [dbMetricKeyToClient(r.metric_type), r]));
  for(const dm of draft.metrics){
    const dbMetric = byClientKey[dm.key];
    if(!dbMetric || !dm.abs) continue;
    for(const ab of dm.abs){
      if(ab.status !== 'queued') continue;
      const contactType = ab.type === 'phone' ? 'phone' : 'email';
      const { error } = await sbClient.from('ab_invites').insert({
        goal_metric_id: dbMetric.id,
        inviter_user_id: currentUser.id,
        first_name: ab.firstName, last_name: ab.lastName || '',
        contact_type: contactType, contact_value: ab.value
      });
      if(error){ showToast("Couldn't invite " + ab.firstName + " — " + error.message); continue; }
      ab.status = 'awaiting';
    }
  }
  saveGoals();
}

// ---------------------------------------------------------------------
// EDIT EXISTING GOAL — loads a saved goal back into `draft` and jumps
// straight to the same editable results/form screen used at creation
// time, so target values, motivation mode, and AB invites (add/remove)
// all reuse the exact same UI instead of a separate edit form.
// ---------------------------------------------------------------------
function editGoal(id){
  const g = goals.find(x => x.id === id);
  if(!g) return;
  const clone = JSON.parse(JSON.stringify(g));
  draft = Object.assign({}, clone);
  draft.editingGoalId = id;

  if(g.category === 'nutrition'){
    if(!clone.nutritionInputs){
      showToast("Couldn't load this goal's details — try refreshing");
      draft = null;
      return;
    }
    nutritionUnits = clone.nutritionInputs.units;
    Object.assign(draft, clone.nutritionInputs);
    draft.driResult = calculateDRI(draft);
    render('nutrition-results');
  } else if(g.category === 'steps'){
    draft.period = clone.metrics[0].periodLabel;
    draft.customDays = clone.metrics[0].customDays;
    draft.stepsMode = clone.metrics[0].stepsMode;
    render('steps-form');
  } else if(g.category === 'custom'){
    draft.period = clone.metrics[0].periodLabel;
    draft.customDays = clone.metrics[0].customDays;
    render('custom-form');
  } else if(g.category === 'withhold'){
    draft.period = clone.metrics[0].periodLabel;
    render('withhold-form');
  }
}
function deleteGoal(id){
  const g = goals.find(x => x.id === id);
  if(!g) return;
  confirmModal('Delete this goal?', `"${g.title}" and everything logged for it will be permanently deleted.`, async () => {
    const { error } = await sbClient.from('goals').delete().eq('id', id);
    if(error){ showToast("Couldn't delete — " + error.message); return; }
    goals = goals.filter(x => x.id !== id);
    const ext = loadExtensions();
    delete ext[id];
    try{ localStorage.setItem(extensionStorageKey(), JSON.stringify(ext)); }catch(e){}
    showToast('Goal deleted');
    render('profile');
  });
}

let currentLogDate = todayKey();

function earliestLoggableDate(){
  let earliest = todayKey();
  goals.forEach(g => {
    ensureLogArrays(g);
    if(g.createdAt){ const k = dateKey(new Date(g.createdAt)); if(k < earliest) earliest = k; }
    [...g.foodLog, ...g.waterLog, ...g.stepsLog, ...g.customLog, ...g.slipLog].forEach(e => { if(e.date < earliest) earliest = e.date; });
  });
  return earliest;
}
function changeLogDay(delta){
  const d = addDays(parseDateKey(currentLogDate), delta);
  const k = dateKey(d);
  if(k > todayKey()) return; // no future
  if(k < earliestLoggableDate()) return; // no data that far back
  currentLogDate = k;
  render('log');
}
function dayLabel(dateStr){
  if(dateStr === todayKey()) return 'Today';
  if(dateStr === dateKey(addDays(new Date(),-1))) return 'Yesterday';
  const d = parseDateKey(dateStr);
  return d.toLocaleDateString([], { month:'short', day:'numeric', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}
function dayNavHtml(){
  const canGoBack = currentLogDate > earliestLoggableDate();
  const canGoForward = currentLogDate < todayKey();
  return `
    <div class="day-nav">
      <button class="day-nav-arrow" onclick="changeLogDay(-1)" ${canGoBack?'':'disabled'} aria-label="Previous day">‹</button>
      <div class="day-nav-label">${dayLabel(currentLogDate)}</div>
      <button class="day-nav-arrow" onclick="changeLogDay(1)" ${canGoForward?'':'disabled'} aria-label="Next day">›</button>
    </div>
  `;
}

function viewLog(){
  goals.forEach(ensureLogArrays);
  if(currentLogDate > todayKey()) currentLogDate = todayKey();
  if(goals.length === 0){
    return `
      <div style="margin-bottom:18px;"><div class="step-title" style="font-size:22px;">Log</div></div>
      <div class="empty-state">
        <p>No goals to log yet — set one up first.</p>
        <button class="btn btn-primary" onclick="startNewGoal()">Add a goal</button>
      </div>
    `;
  }
  const order = { nutrition: 0, steps: 1, withhold: 2, custom: 3 };
  const sortedGoals = [...goals].sort((a,b) => (order[a.category]??9) - (order[b.category]??9));
  return `
    <div style="margin-bottom:14px;"><div class="step-title" style="font-size:22px;">Log</div></div>
    ${dayNavHtml()}
    ${sortedGoals.map(g => {
      if(g.category === 'nutrition') return nutritionLogCardHtml(g);
      if(g.category === 'steps') return stepsLogCardHtml(g);
      if(g.category === 'withhold') return withholdLogCardHtml(g);
      return customLogCardHtml(g);
    }).join('')}
  `;
}

          <div class="me-field"><label>FAT (g)</label><input type="number" min="0" id="me-fat-${g.id}" value="0"></div>
          <div class="me-field"><label>CARBS (g)</label><input type="number" min="0" id="me-carbs-${g.id}" value="0"></div>
          <div class="me-field"><label>WATER (oz)</label><input type="number" min="0" id="me-water-${g.id}" value="0"></div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn btn-primary btn-block" onclick="addManualEntry('${g.id}')">Add to log</button>
        </div>

            <span>🥩 <b>${totals.protein||0}g</b></span>
            <span>🥑 <b>${totals.fat||0}g</b></span>

            <span>💧 <b>${water||0}oz</b></span>
          </div>
        </div>
      </div>
    </div>
  `;
}
function miniMetricRowHtml(label, value, target, unit, key, streak){
  target = parseFloat(target)||0;
  const pct = target > 0 ? Math.min(100, Math.round((value/target)*100)) : 0;
  const style = metricStyle(key);
  const sColor = streakColor(streak||0);
  return `
    <div class="mini-metric-row">
      <div class="mini-metric-top">
        <span class="name">${style.emoji} ${label}</span>
        <span class="amt">${Math.round(value*10)/10} / ${target} ${unit} ${pct>=100 ? '✅' : ''}</span>
      </div>
      <div class="mini-track"><div class="mini-fill" style="width:${pct}%; background:${style.color};"></div></div>
      ${streak > 0 ? `<div class="mini-metric-streak" style="color:${sColor};">${streak} ${streakLabel(streak, 'day')}</div>` : ''}
    </div>
  `;
}
// Manual Entry is a pure totals tool now — no food name, no per-item list.
// Each tap of "Add to log" independently writes whatever of the 5 fields
// is non-zero (calories/protein/fat/carbs go to food_log_entries as one
// nameless entry; water goes to goal_metric_logs against the water metric,
// same table water logging always used), then clears all 5 boxes so the
// next thing can be typed in immediately. The running total shown below
// the button is just today's real totals — the same numbers already
// powering the progress rows above, not a separately tracked figure.
async function addManualEntry(goalId){
  const g = goals.find(x => x.id === goalId);
  const calories = parseFloat(document.getElementById('me-calories-'+goalId).value)||0;
  const protein = parseFloat(document.getElementById('me-protein-'+goalId).value)||0;
  const fat = parseFloat(document.getElementById('me-fat-'+goalId).value)||0;
  const carbs = parseFloat(document.getElementById('me-carbs-'+goalId).value)||0;
  const water = parseFloat(document.getElementById('me-water-'+goalId).value)||0;

  if(calories===0 && protein===0 && fat===0 && carbs===0 && water===0){
    showToast('Enter at least one value before logging');
    return;
  }

  if(calories>0 || protein>0 || fat>0 || carbs>0){
    const { data, error } = await sbClient.from('food_log_entries').insert({
      goal_id: goalId, log_date: currentLogDate, calories, protein_g: protein, fat_g: fat, carbs_g: carbs, source: 'manual'
    }).select().single();
    if(error){ showToast("Couldn't log that — " + error.message); return; }
    g.foodLog.push({ id: data.id, date: data.log_date, name: null, protein: data.protein_g, fat: data.fat_g, carbs: data.carbs_g, calories: data.calories, source: data.source, loggedAt: new Date(data.logged_at).getTime() });
  }

  if(water>0){
    const waterMetric = g.metrics.find(m => m.key === 'water');
    if(!waterMetric){
      showToast('Logged macros, but water tracking is off for this goal');
    } else {
      const { data, error } = await sbClient.from('goal_metric_logs').insert({
        goal_metric_id: waterMetric.id, log_date: currentLogDate, value: water
      }).select().single();
      if(error){ showToast("Couldn't log water — " + error.message); return; }
      g.waterLog.push({ id: data.id, date: data.log_date, amount: data.value, loggedAt: new Date(data.logged_at).getTime() });
    }
  }

  ['calories','protein','fat','carbs','water'].forEach(f => {
    const el = document.getElementById('me-'+f+'-'+goalId);
    if(el) el.value = 0;
  });

  checkNutritionCelebrations(g);
  showToast('Logged');
  render('log');
}

async function logSteps(goalId){

    goal_metric_id: m.id, log_date: currentLogDate, value: val
  }).select().single();
  if(error){ showToast("Couldn't log steps — " + error.message); return; }
  g.stepsLog.push({ id: data.id, date: data.log_date, value: data.value, loggedAt: new Date(data.logged_at).getTime() });
  checkStepsCelebration(g);
  showToast(`+${val} steps logged`);
  render('log');

  const periodWord = m.periodLabel === 'day' ? 'today' : m.periodLabel === 'week' ? 'this week' : m.periodLabel === 'month' ? 'this month' : 'this period';

      <button class="custom-done-btn ${doneThatDay?'done':''}" ${doneThatDay?'disabled':''} onclick="markCustomDone('${g.id}')">

async function markCustomDone(goalId){

  const m = g.metrics[0];
  const { data, error } = await sbClient.from('goal_metric_logs').insert({
    goal_metric_id: m.id, log_date: currentLogDate, completed: true
  }).select().single();
  if(error){ showToast("Couldn't log that — " + error.message); return; }
  g.customLog.push({ id: data.id, date: data.log_date, loggedAt: new Date(data.logged_at).getTime() });

  showToast('Nice — logged 🎉');

// Only fires for today — marking a past day done (if that's ever possible)
// shouldn't pop a celebration for a period that's already over.
function checkCustomCelebration(g){
  if(currentLogDate !== todayKey()) return;
  const m = g.metrics[0];
  checkAndCelebrate(g, 'custom', customStreak(g), shareUnitWord(m.periodLabel));
  saveGoals();

function withholdLogCardHtml(g){

  const streak = withholdStreakDays(g, d);

  const isToday = d === todayKey();

function confirmLogSlip(goalId){
  const g = goals.find(x => x.id === goalId);
  confirmModal('Log a slip?', `This resets your streak counting forward from ${dayLabel(currentLogDate).toLowerCase()}. That's okay — the count starting over doesn't erase the days you already had.`, async () => {
    const m = g.metrics[0];
    await sbClient.from('goal_metric_logs').delete().eq('goal_metric_id', m.id).eq('log_date', currentLogDate);
    const { data, error } = await sbClient.from('goal_metric_logs').insert({
      goal_metric_id: m.id, log_date: currentLogDate, completed: true
    }).select().single();
    if(error){ showToast("Couldn't log that — " + error.message); return; }
    g.slipLog = (g.slipLog||[]).filter(e => e.date !== currentLogDate);
    g.slipLog.push({ id: data.id, date: data.log_date, loggedAt: new Date(data.logged_at).getTime() });
    showToast('Logged — tomorrow is day 1 again');
    render('log');
  });
}
async function undoSlip(goalId){
  const g = goals.find(x => x.id === goalId);
  const m = g.metrics[0];
  const { error } = await sbClient.from('goal_metric_logs').delete().eq('goal_metric_id', m.id).eq('log_date', currentLogDate);
  if(error){ showToast("Couldn't remove — " + error.message); return; }
  g.slipLog = (g.slipLog||[]).filter(e => e.date !== currentLogDate);
  showToast('Removed');
  render('log');
}

function editStat(goalId, field){
  const g = goals.find(x => x.id === goalId);
  const ni = g.nutritionInputs;
  const finish = async () => {
    recalcNutritionGoal(g);
    const ok = await persistNutritionEdit(g);
    if(!ok) return;
    showToast('Updated — your daily targets were recalculated');
    render('profile');
  };

  if(field === 'sex'){
    chooseModal('Sex', [ {value:'male',label:'Male'}, {value:'female',label:'Female'} ], (v) => { ni.sex = v; finish(); });
  }
  else if(field === 'age'){
    promptModal('Age', { type:'number', value: ni.age, onConfirm: (v) => {
      if(isNaN(parseInt(v))) return;
      ni.age = parseInt(v); finish();
    }});
  }
  else if(field === 'height'){
    if(ni.units === 'us'){
      promptModal('Height — feet', { type:'number', value: ni.heightFt, onConfirm: (ft) => {
        if(isNaN(parseInt(ft))) return;
        promptModal('Height — inches', { type:'number', value: ni.heightIn, onConfirm: (inch) => {
          if(isNaN(parseInt(inch))) return;
          ni.heightFt = parseInt(ft); ni.heightIn = parseInt(inch); finish();
        }});
      }});
    } else {
      promptModal('Height (cm)', { type:'number', value: ni.heightCm, onConfirm: (cm) => {
        if(isNaN(parseFloat(cm))) return;
        ni.heightCm = parseFloat(cm); finish();
      }});
    }
  }
  else if(field === 'weight'){
    if(ni.units === 'us'){
      promptModal('Weight (lb)', { type:'number', value: ni.weightLb, onConfirm: (lb) => {
        if(isNaN(parseFloat(lb))) return;
        ni.weightLb = parseFloat(lb); finish();
      }});
    } else {
      promptModal('Weight (kg)', { type:'number', value: ni.weightKg, onConfirm: (kg) => {
        if(isNaN(parseFloat(kg))) return;
        ni.weightKg = parseFloat(kg); finish();
      }});
    }
  }
  else if(field === 'activity'){
    chooseModal('Activity level', [
      {value:'inactive',label:'Inactive'}, {value:'low_active',label:'Low active'},
      {value:'active',label:'Active'}, {value:'very_active',label:'Very active'}
    ], (v) => { ni.activity = v; finish(); });
  }
  else if(field === 'direction'){
    chooseModal('Goal', [
      {value:'lose',label:'Lose weight'}, {value:'maintain',label:'Maintain'}, {value:'gain',label:'Gain weight'}
    ], (v) => { ni.direction = v; finish(); });
  }
}

// Recalculates a goal's DRI targets after an About-You edit. If the person
// had manually customized a target (value !== originalValue), we keep
// their override and only move the "Reset" baseline — we don't silently
// overwrite a number they intentionally changed.
function recalcNutritionGoal(g){
  const ni = g.nutritionInputs;
  const savedUnits = nutritionUnits;
  nutritionUnits = ni.units;
  const result = calculateDRI(ni);
  nutritionUnits = savedUnits;

  const newBaselines = {
    calories: result.calories, protein: result.proteinG, fat: result.fatG,
    carbs: result.carbG, water: result.waterOz
  };
  g.metrics.forEach(m => {
    if(newBaselines[m.key] === undefined) return;
    const wasCustomized = m.value != m.originalValue;
    m.originalValue = newBaselines[m.key];
    if(!wasCustomized) m.value = newBaselines[m.key];
  });
}

// Writes an editStat()/recalcNutritionGoal() change to the real rows:
// nutrition_profiles (the edited field plus the recalculated calculated_*
// baselines) and each affected goal_metrics row's target_value. Called
// after the local recalc already ran, so g.metrics reflects the new
// numbers this just needs to persist.
async function persistNutritionEdit(g){
  const ni = g.nutritionInputs;
  const heightCm = ni.units === 'us'
    ? ((parseFloat(ni.heightFt)||0)*12 + (parseFloat(ni.heightIn)||0)) * 2.54
    : parseFloat(ni.heightCm) || 0;
  const weightKg = ni.units === 'us'
    ? (parseFloat(ni.weightLb)||0) / 2.20462
    : parseFloat(ni.weightKg) || 0;
  const byKey = Object.fromEntries(g.metrics.map(m => [m.key, m]));

  const { error: npErr } = await sbClient.from('nutrition_profiles').update({
    sex: ni.sex, age_years: parseInt(ni.age) || 0,
    height_cm: Math.round(heightCm*10)/10, weight_kg: Math.round(weightKg*10)/10,
    activity_level: ni.activity, goal_direction: ni.direction,
    calculated_calories: byKey.calories ? byKey.calories.originalValue : null,
    calculated_protein_g: byKey.protein ? byKey.protein.originalValue : null,
    calculated_fat_g: byKey.fat ? byKey.fat.originalValue : null,
    calculated_carbs_g: byKey.carbs ? byKey.carbs.originalValue : null,
    calculated_water_ml: byKey.water ? Math.round(byKey.water.originalValue * 29.5735) : null
  }).eq('goal_id', g.id);
  if(npErr){ showToast("Couldn't save — " + npErr.message); return false; }

  for(const m of g.metrics){
    if(!m.id) continue;
    const { error: mErr } = await sbClient.from('goal_metrics')
      .update({ target_value: parseFloat(m.value) || 0 }).eq('id', m.id);
    if(mErr){ showToast("Couldn't save " + m.label + " — " + mErr.message); return false; }
  }
  return true;
}

// Simulated preview only — no backend scheduler exists in this browser-only
// prototype to actually run a 60-day timer. Derives a deterministic cycle
// from the goal's createdAt so the UI has something real to show; once a
// real backend exists, this reads from ab_checkins instead.
function abCheckinStatusHtml(goal){
  const CYCLE_DAYS = 60;
  const RESPOND_WINDOW_DAYS = 7;
  const daysSince = Math.max(0, Math.floor((Date.now() - (goal.createdAt||Date.now())) / 86400000));
  const daysUntilCheckin = CYCLE_DAYS - (daysSince % CYCLE_DAYS);
  const pending = daysUntilCheckin <= RESPOND_WINDOW_DAYS;
  const date = addDays(new Date(), daysUntilCheckin).toLocaleDateString([], {month:'short', day:'numeric'});
  return pending
    ? `<div class="ab-checkin-status ab-checkin-pending">⏳ Check-in sent — respond by ${date} or they're auto-withdrawn</div>`
    : `<div class="ab-checkin-status">Next "still in?" check-in: ${date}</div>`;
}

// =======================================================================
// CHALLENGES — competitive counterpart to private goals. A challenge is
// named once and can combine several ITEMS under one shared roster and
// leaderboard (nutrition + steps + custom + abstain, any mix) — same
// relationship shape as goals -> goal_metrics. Each item scores 10/7/3/0
// on its own (10/0 clean-vs-slip for abstain items); a participant's
// total is the sum across every item, live-scored client-side from real
// logged data, same philosophy the rest of the app already uses for
// streaks rather than a batch job that finalizes after a period closes.
// =======================================================================
const NUTRITION_METRIC_UNIT = { calories:'kcal', protein:'g', fat:'g', carbs:'g', water:'fl oz' };

// ---- points engine (pure — no DOM) ----
// Tiers are per-item now (item.ptsFull/ptsNinety/ptsSeventy/ptsBelow),
// editable by the creator — no more single hardcoded 10/7/3/0 for
// everyone. Defaults match that same scale until edited.
function challengeTierPointsForItem(item, pct){
  if(pct >= 1) return item.ptsFull;
  if(pct >= 0.9) return item.ptsNinety;
  if(pct >= 0.7) return item.ptsSeventy;
  return item.ptsBelow;
}
function challengeItemUserLogs(ch, item, userId){
  return ch.logs.filter(l => l.userId === userId && l.itemId === item.id);
}
function getChallengeItemPeriodWindow(ch, item, refDateStr){
  return getPeriodWindow({ createdAt: parseDateKey(ch.startDate).getTime() }, { periodLabel: item.periodLabel, customDays: item.customDays }, refDateStr);
}
function challengeItemDailyPoints(item, logs, dateStr){
  if(item.category === 'withhold'){
    const slipped = logs.some(l => l.date === dateStr && l.slipped);
    return slipped ? item.ptsBelow : item.ptsFull;
  }
  const val = logs.filter(l => l.date === dateStr).reduce((s,l) => s + (parseFloat(l.value)||0), 0);
  const pct = item.targetValue > 0 ? val / item.targetValue : 0;
  return challengeTierPointsForItem(item, pct);
}
function challengeItemPointsForUser(ch, item, userId){
  const logs = challengeItemUserLogs(ch, item, userId);
  const today = todayKey();
  const endKey = ch.endDate < today ? ch.endDate : today;
  if(endKey < ch.startDate) return 0;
  const isDaily = item.category === 'withhold' || item.category === 'nutrition' || (item.category === 'steps' && item.stepsMode === 'daily');
  if(isDaily){
    let total = 0;
    let cursor = parseDateKey(ch.startDate);
    while(dateKey(cursor) <= endKey){
      total += challengeItemDailyPoints(item, logs, dateKey(cursor));
      cursor = addDays(cursor, 1);
    }
    return total;
  }
  // period-based: steps (cumulative) or custom — bounded to 500 periods,
  // same convention as periodTargetStreak.
  let total = 0;
  let cursor = parseDateKey(ch.startDate);
  for(let i = 0; i < 500; i++){
    const win = getChallengeItemPeriodWindow(ch, item, dateKey(cursor));
    const cappedEnd = win.end > endKey ? endKey : win.end;
    let achieved;
    if(item.category === 'custom'){
      achieved = new Set(logs.filter(l => l.date >= win.start && l.date <= cappedEnd).map(l => l.date)).size;
    } else {
      achieved = logs.filter(l => l.date >= win.start && l.date <= cappedEnd).reduce((s,l) => s + (parseFloat(l.value)||0), 0);
    }
    const pct = item.targetValue > 0 ? achieved / item.targetValue : 0;
    total += challengeTierPointsForItem(item, pct);
    if(win.end >= endKey) break;
    cursor = addDays(parseDateKey(win.end), 1);
  }
  return total;
}
// Combined score across every item in the challenge — sum, not average,
// so showing up across the whole challenge beats acing just one item.
function challengePointsForUser(ch, userId){
  return ch.items.reduce((sum, item) => sum + challengeItemPointsForUser(ch, item, userId), 0);
}
function challengeLeaderboard(ch){
  return ch.participants.map(p => Object.assign({}, p, { points: challengePointsForUser(ch, p.userId) }))
    .sort((a,b) => b.points - a.points);
}
function challengeStatus(ch){
  const today = todayKey();
  if(today < ch.startDate) return { phase:'upcoming', days: Math.round((parseDateKey(ch.startDate)-parseDateKey(today))/86400000) };
  if(today > ch.endDate) return { phase:'ended', days: 0 };
  return { phase:'active', days: Math.round((parseDateKey(ch.endDate)-parseDateKey(today))/86400000) + 1 };
}
function itemEmoji(item){
  if(item.category === 'nutrition') return metricStyle(item.metricKey).emoji;
  return { steps:'👣', custom:'✅', withhold:'🚫' }[item.category] || '🎯';
}
function challengeItemTargetLabel(item){
  if(item.category === 'withhold') return `${item.label} — no slipping`;
  if(item.category === 'custom') return `${item.label}: ${item.targetValue}x / ${periodNounFor(item.periodLabel)}`;
  if(item.category === 'steps') return `${item.label}: ${Number(item.targetValue).toLocaleString()}${item.stepsMode==='daily' ? '/day' : '/' + periodNounFor(item.periodLabel)}`;
  return `${item.label}: ${item.targetValue}${item.unit?' '+item.unit:''}/day`;
}
function challengeSummaryLabel(ch){

async function saveChallengeAndFinish(){
  const cd = challengeDraft;
  if(!cd.title || !cd.title.trim()){ showToast('Give your challenge a name'); return; }
  if(!cd.startDate || !cd.endDate || cd.endDate < cd.startDate){ showToast('Check your start/end dates'); return; }
  if(cd.items.length === 0){ showToast('Add at least one item to compete on'); return; }

  showToast('Creating challenge…');
  const { data: chRow, error: chErr } = await sbClient.from('challenges').insert({
    creator_user_id: currentUser.id, title: cd.title.trim(), start_date: cd.startDate, end_date: cd.endDate
  }).select().single();
  if(chErr){ showToast("Couldn't create challenge — " + chErr.message); return; }

  const { error: pErr } = await sbClient.from('challenge_participants').insert({ challenge_id: chRow.id, user_id: currentUser.id });
  if(pErr) showToast("Couldn't add you as a participant — " + pErr.message);

  const itemRows = cd.items.map(it => ({
    challenge_id: chRow.id,
    category: clientCategoryToDb(it.category),
    metric_type: clientMetricKeyToDb(it.category === 'nutrition' ? it.metricKey : it.category),
    label: it.label,
    target_value: it.category === 'withhold' ? null : parseFloat(it.targetValue),
    unit: it.unit || null,
    period_type: (it.category === 'nutrition' || it.category === 'withhold' || (it.category==='steps' && it.stepsMode==='daily')) ? 'daily' : clientPeriodToDb(it.periodLabel || 'week'),
    custom_period_days: it.periodLabel === 'custom' ? (parseInt(it.customDays) || null) : null,
    steps_mode: it.category === 'steps' ? (it.stepsMode || 'daily') : null,
    pts_full: parseFloat(it.ptsFull) || 0,
    pts_ninety: parseFloat(it.ptsNinety) || 0,
    pts_seventy: parseFloat(it.ptsSeventy) || 0,
    pts_below: parseFloat(it.ptsBelow) || 0
  }));
  const { error: iErr } = await sbClient.from('challenge_items').insert(itemRows);
  if(iErr){ showToast("Couldn't save items — " + iErr.message); return; }

  for(const inv of (cd.invites||[])){
    const { error: invErr } = await sbClient.from('challenge_invites').insert({
      challenge_id: chRow.id, inviter_user_id: currentUser.id,
      first_name: inv.firstName, last_name: inv.lastName || '',
      contact_type: inv.type === 'phone' ? 'phone' : 'email',
      contact_value: inv.value
    });
    if(invErr) showToast("Couldn't invite " + inv.firstName + " — " + invErr.message);
  }

  await loadChallenges();
  challengeDraft = null;
  showToast('Challenge created 🏆');
  render('challenges');
}

// A "nicer" leaderboard: avatar initials, a points bar scaled against the
// leader so the gap is visible at a glance, and its own card so it reads
// as clearly separate from the logging section below it.
function challengeLeaderboardCardHtml(ch, board){
  const medals = ['🥇','🥈','🥉'];
  const maxPts = Math.max(1, ...board.map(p => p.points));
  return `
    <div class="leaderboard-card">
      <div class="leaderboard-card-title">🏆 Leaderboard</div>
      ${board.map((p,i) => `
        <div class="lb-row ${p.userId===currentUser.id ? 'is-me' : ''}">
          <div class="lb-rank ${i<3?'medal':''}">${i<3 ? medals[i] : (i+1)}</div>
          <div class="lb-avatar" style="background:${avatarColor(p.displayName)};">${(p.displayName||'?').trim().charAt(0).toUpperCase()}</div>
          <div class="lb-main">
            <div class="lb-name">${p.displayName}${p.userId===currentUser.id ? '<span class="you-tag">YOU</span>' : ''}</div>
            <div class="lb-bar-track"><div class="lb-bar-fill" style="width:${Math.max(4, p.points/maxPts*100)}%; background:${i===0 ? '#E8B923' : 'var(--green)'};"></div></div>
          </div>
          <div class="lb-points-wrap">
            <div class="lb-points">${p.points}</div>
            <div class="lb-points-label">pts</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function avatarColor(name){
  const palette = ['#6FBF3E','#3E8FD6','#8B5FBF','#E8823C','#D24B4B','#3EC6C6'];
  let hash = 0;
  const s = name || '?';
  for(let i=0; i<s.length; i++) hash = (hash*31 + s.charCodeAt(i)) % palette.length;
  return palette[Math.abs(hash) % palette.length];
}

function challengeItemLogBoxHtml(ch, item){
  const myLogs = challengeItemUserLogs(ch, item, currentUser.id);
  const today = todayKey();
  const emoji = itemEmoji(item);
  if(item.category === 'withhold'){
    const slippedToday = myLogs.some(l => l.date === today && l.slipped);
    return `
      <div class="log-today-box">
        <h4>${emoji} ${item.label}</h4>
        ${slippedToday
          ? `<div class="meta">You logged a slip today. Tomorrow's a fresh start.</div>`

             <button class="btn btn-ghost" onclick="logChallengeItemSlip(${jsAttr(ch.id)}, ${jsAttr(item.id)})">Log a slip today</button>`
        }
      </div>
    `;
  }
  if(item.category === 'custom'){
    const doneToday = myLogs.some(l => l.date === today);
    return `
      <div class="log-today-box">
        <h4>${emoji} ${item.label}</h4>
        ${doneToday ? `<div class="meta">✅ Logged for today.</div>` : `<button class="btn btn-primary btn-block" onclick="logChallengeItemCheckin(${jsAttr(ch.id)}, ${jsAttr(item.id)})">Log today's check-in</button>`}

  const todaySum = myLogs.filter(l=>l.date===today).reduce((s,l)=>s+(parseFloat(l.value)||0),0);
  return `
    <div class="log-today-box">
      <h4>${emoji} ${item.label}${todaySum>0 ? ` — logged ${todaySum}${item.unit?' '+item.unit:''} so far` : ''}</h4>

}
function addMoreInvite(){
  const firstName = document.getElementById('more-inv-fname').value.trim();
  const lastName = document.getElementById('more-inv-lname').value.trim();
  const type = document.getElementById('more-inv-type').value;
  const val = document.getElementById('more-inv-value').value.trim();
  if(!firstName){ showToast('First name is required'); return; }
  if(!val) return;
  moreInvitesDraft.push({ firstName, lastName, type, value: val });
  render('challenge-manage');
}
function removeMoreInvite(j){ moreInvitesDraft.splice(j,1); render('challenge-manage'); }
async function sendMoreChallengeInvites(){
  if(moreInvitesDraft.length === 0){ showToast('Add at least one person first'); return; }
  const ch = myChallenges.find(c => c.id === currentChallengeId);
  if(!ch) return;
  for(const inv of moreInvitesDraft){
    const { error } = await sbClient.from('challenge_invites').insert({
      challenge_id: ch.id, inviter_user_id: currentUser.id,
      first_name: inv.firstName, last_name: inv.lastName || '',
      contact_type: inv.type === 'phone' ? 'phone' : 'email',
      contact_value: inv.value
    });
    if(error) showToast("Couldn't invite " + inv.firstName + " — " + error.message);
  }
  moreInvitesDraft = [];
  await loadChallenges();
  showToast('Invites sent');
  render('challenge-manage');
}

  signOut();
}
